name: Compress Images

on:
  push:
    branches:
      - main
    paths:
      - 'public/photos/**'

permissions:
  contents: write
  actions: write

jobs:
  compress:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Optimize images
        id: optimize
        uses: calibreapp/image-actions@1.5.0
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          jpegQuality: 80
          pngQuality: 80
          webpQuality: 80

      - name: Commit optimized images
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add public/photos
            git commit -m "chore: compress images"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No image changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # 用 GITHUB_TOKEN 产生的 push 不会自动触发 deploy 工作流，这里显式触发一次。
      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
