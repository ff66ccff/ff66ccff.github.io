name: Update Post Metadata

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh-metadata:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update post metadata
        run: node scripts/update-post-metadata.js

      - name: Verify metadata for pull requests
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet; then
            echo "Metadata is up to date."
          else
            echo "::error::Post metadata is out of date. Run 'node scripts/update-post-metadata.js'."
            git diff
            exit 1
          fi

      - name: Commit metadata updates
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: chore: refresh post metadata
          file_pattern: 'posts/**'
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Push changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git status
