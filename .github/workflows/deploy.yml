name: Deploy Hexo site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install

      - name: Auto-generate frontmatter
        run: node scripts/add-frontmatter.js

      - name: Build with Hexo
        run: npx hexo clean --config _config.yml && npx hexo generate --config _config.yml

      - name: Debug build output
        run: |
          npx hexo config public_dir source_dir theme
          echo "Posts:";
          ls -la source/_posts || true
          ls -la
          ls -la docs || true
          ls -la public || true
          find . -maxdepth 3 -type f -name index.html | head -n 20
          npx hexo list route || true

      - name: Verify build output
        run: |
          OUTPUT_DIR=docs
          if [ ! -d "$OUTPUT_DIR" ]; then
            echo "No build output directory: $OUTPUT_DIR"
            find . -maxdepth 3 -type f -name index.html | head -n 50
            exit 1
          fi
          if [ ! -f "$OUTPUT_DIR/index.html" ]; then
            echo "Missing $OUTPUT_DIR/index.html"
            find "$OUTPUT_DIR" -maxdepth 3 -type f -name index.html | head -n 20
            exit 1
          fi
          echo "OUTPUT_DIR=${OUTPUT_DIR}" >> $GITHUB_ENV
          touch "${OUTPUT_DIR}/.nojekyll"
          ls -la "${OUTPUT_DIR}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUTPUT_DIR }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
