name: Deploy Hexo site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install

      - name: Auto-generate frontmatter
        run: node scripts/add-frontmatter.js

      - name: Build with Hexo
        run: |
          npx hexo clean --config _config.yml
          npx hexo generate --config _config.yml

      - name: Verify output
        run: |
          if [ ! -d public ]; then
            echo "public directory missing"
            find . -maxdepth 3 -type f -name index.html | head -n 50
            exit 1
          fi
          if [ ! -f public/index.html ]; then
            echo "public/index.html missing"
            find public -maxdepth 3 -type f -name index.html | head -n 20
            exit 1
          fi
          touch public/.nojekyll
          ls -la public | head -n 40
          echo "index size:" $(stat -c%s public/index.html)

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
          if-no-files-found: error

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
