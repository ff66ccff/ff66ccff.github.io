<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客 - ff66ccff</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css">
    <style>
        :root {
            --primary-color: #667eea;
            --secondary-color: #764ba2;
            --accent-blue: #4facfe;
            --accent-pink: #f093fb;
            --accent-cyan: #00d4ff;
            --bg-primary: #f5f7fa;
            --bg-card: rgba(255, 255, 255, 0.9);
            --bg-elevated: rgba(255, 255, 255, 0.94);
            --text-primary: #1f2937;
            --text-secondary: #4b5563;
            --text-muted: #6b7280;
            --border-color: rgba(15, 23, 42, 0.08);
            --shadow-sm: 0 4px 14px rgba(15, 23, 42, 0.08);
            --shadow-md: 0 16px 44px rgba(15, 23, 42, 0.16);
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-card: rgba(14, 23, 42, 0.92);
            --bg-elevated: rgba(17, 28, 52, 0.96);
            --text-primary: #f8fafc;
            --text-secondary: #cbd5f5;
            --text-muted: #94a3b8;
            --border-color: rgba(148, 163, 184, 0.26);
            --shadow-sm: 0 4px 20px rgba(8, 15, 35, 0.65);
            --shadow-md: 0 24px 60px rgba(8, 15, 35, 0.78);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Poppins', 'Helvetica Neue', Arial, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(102, 126, 234, 0.18), transparent 62%),
                radial-gradient(circle at bottom right, rgba(118, 75, 162, 0.16), transparent 68%),
                var(--bg-primary);
            color: var(--text-primary);
            padding: 32px 16px 56px;
            transition: background 0.4s ease, color 0.4s ease;
        }

        body.is-overlay-open {
            overflow: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .page-shell {
            width: 100%;
            max-width: 1080px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .brand {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .ghost-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 14px;
            border: 1px solid rgba(102, 126, 234, 0.35);
            color: var(--primary-color);
            font-weight: 600;
            background: rgba(102, 126, 234, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .ghost-link:hover {
            background: rgba(102, 126, 234, 0.16);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        .content-card {
            background: var(--bg-card);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 36px;
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            gap: 28px;
            backdrop-filter: blur(6px);
        }

        .panel-header {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .panel-header h1 {
            margin: 0;
            font-size: 2.1rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .panel-header p {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.98rem;
        }

        .search-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            border-radius: 18px;
            border: 1px solid rgba(102, 126, 234, 0.28);
            background: rgba(102, 126, 234, 0.08);
        }

        .search-row i {
            color: var(--primary-color);
        }

        .search-row input {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--text-primary);
            font-size: 0.98rem;
            outline: none;
        }

        .post-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .post-card {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 22px 24px;
            background: var(--bg-elevated);
            border-radius: 22px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            box-shadow: var(--shadow-sm);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .post-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
        }

        .post-title-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--primary-color);
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
            text-align: left;
        }

        .post-title-btn:hover {
            text-decoration: underline;
        }

        .post-summary {
            margin: 0;
            color: var(--text-secondary);
            line-height: 1.6;
            font-size: 0.92rem;
        }

        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 48px 24px;
            border-radius: 20px;
            border: 1px dashed rgba(102, 126, 234, 0.4);
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .control-btn {
            position: fixed;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-color);
            background: var(--bg-elevated);
            color: var(--text-primary);
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            z-index: 1200;
        }

        .control-btn:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }

        .theme-toggle {
            top: 26px;
            right: 26px;
        }

        .language-toggle {
            top: 26px;
            left: 26px;
            font-weight: 600;
        }

        .article-overlay {
            position: fixed;
            inset: 0;
            padding: 32px 16px;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(8px);
            display: grid;
            place-items: center;
            z-index: 2000;
        }

        .article-dialog {
            width: min(1040px, 100%);
            height: min(90vh, 860px);
            background: var(--bg-card);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .overlay-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            padding: 24px 28px 16px;
        }

        .overlay-header h2 {
            margin: 0;
            font-size: 1.7rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .overlay-meta {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .overlay-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 0 28px 18px;
            flex-wrap: wrap;
        }

        .overlay-nav {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .overlay-body {
            flex: 1;
            overflow-y: auto;
            padding: 0 32px 32px;
            line-height: 1.75;
            color: var(--text-secondary);
        }

        #overlayContent h1,
        #overlayContent h2,
        #overlayContent h3,
        #overlayContent h4 {
            color: var(--text-primary);
            margin-top: 28px;
            margin-bottom: 14px;
        }

        #overlayContent p,
        #overlayContent ul,
        #overlayContent ol {
            margin-bottom: 16px;
        }

        #overlayContent pre {
            background: rgba(13, 17, 23, 0.88);
            border-radius: 16px;
            padding: 18px 20px;
            overflow-x: auto;
            color: #f8f8f2;
        }

        [data-theme="dark"] #overlayContent pre {
            background: rgba(13, 19, 31, 0.88);
        }

        #overlayContent blockquote {
            border-left: 4px solid var(--primary-color);
            padding-left: 16px;
            margin: 20px 0;
            background: rgba(102, 126, 234, 0.12);
            border-radius: 0 16px 16px 0;
        }

        .ghost-btn,
        .icon-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border-radius: 14px;
            border: 1px solid rgba(102, 126, 234, 0.35);
            background: transparent;
            color: var(--primary-color);
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .ghost-btn {
            padding: 10px 20px;
        }

        .ghost-btn:hover,
        .icon-btn:hover {
            background: rgba(102, 126, 234, 0.14);
            transform: translateY(-2px);
        }

        .ghost-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
        }

        .icon-btn {
            padding: 10px 12px;
            border-radius: 50%;
        }

        .article-overlay[hidden] {
            display: none;
        }

        @media (max-width: 900px) {
            .post-list {
                grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            }
        }

        @media (max-width: 720px) {
            body {
                padding: 24px 12px 48px;
            }

            .content-card {
                padding: 28px;
            }

            .article-dialog {
                height: 100vh;
                width: 100%;
                border-radius: 0;
            }

            .overlay-header,
            .overlay-toolbar,
            .overlay-body {
                padding-left: 20px;
                padding-right: 20px;
            }
        }

        @media (max-width: 520px) {
            .panel-header h1 {
                font-size: 1.8rem;
            }

            .ghost-link {
                padding: 10px 14px;
            }

            .ghost-btn {
                width: 100%;
                justify-content: center;
            }

            .overlay-toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .overlay-nav {
                width: 100%;
                justify-content: space-between;
            }

            .theme-toggle {
                top: 18px;
                right: 18px;
            }

            .language-toggle {
                top: 18px;
                left: 18px;
            }
        }
    </style>
</head>

<body>
    <div class="page-shell">
        <header class="page-header">
            <a class="brand" href="index.html">ff66ccff</a>
            <div class="header-actions">
                <a class="ghost-link" href="index.html" id="backHomeLink">
                    <i class="fas fa-arrow-left"></i>
                    <span id="backHomeLabel">返回首页</span>
                </a>
            </div>
        </header>

        <main class="content-card hover-surface">
            <div class="panel-header">
                <h1 id="blogTitle">博客</h1>
                <p id="blogSubtitle">记录代码、音乐和故事</p>
            </div>
            <div class="search-row hover-surface">
                <i class="fas fa-search"></i>
                <input type="search" id="searchInput" placeholder="搜索文章标题或内容" aria-label="搜索文章">
            </div>
            <div id="postList" class="post-list"></div>
            <div id="emptyState" class="empty-state" hidden>文章加载中，请稍候...</div>
        </main>
    </div>

    <div class="control-btn theme-toggle" id="themeToggle" title="切换主题">
        <i class="fas fa-moon"></i>
    </div>

    <div class="control-btn language-toggle" id="languageToggle" title="切换语言">
        <span>中</span>
    </div>

    <div class="article-overlay" id="articleOverlay" hidden>
        <div class="article-dialog" role="dialog" aria-modal="true" aria-labelledby="overlayTitle">
            <header class="overlay-header">
                <div>
                    <h2 id="overlayTitle">文章标题</h2>
                    <div class="overlay-meta" id="overlayMeta"></div>
                </div>
                <button class="icon-btn" id="closeOverlay" type="button" title="关闭">
                    <i class="fas fa-times"></i>
                </button>
            </header>
            <div class="overlay-toolbar">
                <button class="ghost-btn" id="scrollTopBtn" type="button">
                    <i class="fas fa-arrow-up"></i>
                    <span id="scrollTopLabel">回到开头</span>
                </button>
                <button class="ghost-btn" id="scrollBottomBtn" type="button">
                    <i class="fas fa-arrow-down"></i>
                    <span id="scrollBottomLabel">前往结尾</span>
                </button>
                <div class="overlay-nav">
                    <button class="ghost-btn" id="prevPost" type="button">
                        <i class="fas fa-chevron-left"></i>
                        <span id="prevPostLabel">上一篇</span>
                    </button>
                    <button class="ghost-btn" id="nextPost" type="button">
                        <span id="nextPostLabel">下一篇</span>
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            </div>
            <div class="overlay-body" id="overlayScroll">
                <article id="overlayContent"></article>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script>
        const i18n = {
            zh: {
                blogTitle: "博客",
                blogSubtitle: "记录代码、音乐和故事",
                searchPlaceholder: "搜索文章标题或内容",
                empty: "没有找到相关文章，换个关键词试试？",
                loading: "文章加载中，请稍候...",
                error: "文章加载失败，请稍后再试。",
                backHome: "返回首页",
                scrollTop: "回到开头",
                scrollBottom: "前往结尾",
                prevPost: "上一篇",
                nextPost: "下一篇",
                fileLabel: "文件名",
                close: "关闭全文",
                langToggle: "中",
                themeTitle: "切换主题",
                langTitle: "切换语言",
                overlayTitle: "文章全文",
                pageTitle: "博客 - ff66ccff"
            },
            en: {
                blogTitle: "Blog",
                blogSubtitle: "Notes on code, music, and stories",
                searchPlaceholder: "Search by title or contents",
                empty: "No matching posts. Try different keywords?",
                loading: "Loading posts, please wait...",
                error: "Failed to load posts. Please try again later.",
                backHome: "Back Home",
                scrollTop: "Jump to Top",
                scrollBottom: "Jump to Bottom",
                prevPost: "Previous",
                nextPost: "Next",
                fileLabel: "Filename",
                close: "Close",
                langToggle: "EN",
                themeTitle: "Toggle Theme",
                langTitle: "Switch Language",
                overlayTitle: "Full article",
                pageTitle: "Blog - ff66ccff"
            }
        };

        const elements = {
            themeToggle: document.getElementById('themeToggle'),
            languageToggle: document.getElementById('languageToggle'),
            searchInput: document.getElementById('searchInput'),
            postList: document.getElementById('postList'),
            emptyState: document.getElementById('emptyState'),
            blogTitle: document.getElementById('blogTitle'),
            blogSubtitle: document.getElementById('blogSubtitle'),
            backHomeLabel: document.getElementById('backHomeLabel'),
            backHomeLink: document.getElementById('backHomeLink'),
            overlay: document.getElementById('articleOverlay'),
            overlayTitle: document.getElementById('overlayTitle'),
            overlayMeta: document.getElementById('overlayMeta'),
            overlayContent: document.getElementById('overlayContent'),
            overlayScroll: document.getElementById('overlayScroll'),
            closeOverlay: document.getElementById('closeOverlay'),
            scrollTopBtn: document.getElementById('scrollTopBtn'),
            scrollBottomBtn: document.getElementById('scrollBottomBtn'),
            prevPost: document.getElementById('prevPost'),
            nextPost: document.getElementById('nextPost'),
            scrollTopLabel: document.getElementById('scrollTopLabel'),
            scrollBottomLabel: document.getElementById('scrollBottomLabel'),
            prevPostLabel: document.getElementById('prevPostLabel'),
            nextPostLabel: document.getElementById('nextPostLabel')
        };

        const state = {
            posts: [],
            filtered: [],
            currentIndex: -1,
            loaded: false
        };

        let currentLang = 'zh';
        let pendingSlug = null;

        function getBrowserLanguage() {
            const lang = navigator.language || navigator.userLanguage || '';
            return lang.toLowerCase().startsWith('zh') ? 'zh' : 'en';
        }

        function updateEmptyStateText() {
            const t = i18n[currentLang];
            const status = elements.emptyState.dataset.state || 'empty';
            if (status === 'loading') {
                elements.emptyState.textContent = t.loading;
            } else if (status === 'error') {
                elements.emptyState.textContent = t.error;
            } else {
                elements.emptyState.textContent = t.empty;
            }
        }

        function updateOverlayMeta() {
            if (state.currentIndex < 0) {
                elements.overlayMeta.textContent = '';
                return;
            }
            const post = state.posts[state.currentIndex];
            if (!post) {
                elements.overlayMeta.textContent = '';
                return;
            }
            elements.overlayMeta.textContent = `${i18n[currentLang].fileLabel}: ${post.filename}`;
        }

        function setLanguage(lang) {
            currentLang = lang;
            const t = i18n[lang];
            document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en-US';
            document.title = t.pageTitle;
            elements.blogTitle.textContent = t.blogTitle;
            elements.blogSubtitle.textContent = t.blogSubtitle;
            elements.searchInput.placeholder = t.searchPlaceholder;
            elements.backHomeLabel.textContent = t.backHome;
            elements.languageToggle.querySelector('span').textContent = t.langToggle;
            elements.themeToggle.title = t.themeTitle;
            elements.languageToggle.title = t.langTitle;
            elements.scrollTopLabel.textContent = t.scrollTop;
            elements.scrollBottomLabel.textContent = t.scrollBottom;
            elements.prevPostLabel.textContent = t.prevPost;
            elements.nextPostLabel.textContent = t.nextPost;
            elements.closeOverlay.title = t.close;
            updateEmptyStateText();
            updateOverlayMeta();
            localStorage.setItem('language', lang);
        }

        function initLanguage() {
            const savedLang = localStorage.getItem('language');
            const langToUse = savedLang === 'zh' || savedLang === 'en' ? savedLang : getBrowserLanguage();
            setLanguage(langToUse);
        }

        function initLanguageToggle() {
            elements.languageToggle.addEventListener('click', () => {
                const next = currentLang === 'zh' ? 'en' : 'zh';
                setLanguage(next);
            });
        }

        function initTheme() {
            const themeIcon = elements.themeToggle.querySelector('i');
            const saved = localStorage.getItem('theme');
            if (saved === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeIcon.classList.replace('fa-moon', 'fa-sun');
            }
            elements.themeToggle.addEventListener('click', () => {
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                if (isDark) {
                    document.documentElement.removeAttribute('data-theme');
                    themeIcon.classList.replace('fa-sun', 'fa-moon');
                    localStorage.setItem('theme', 'light');
                } else {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    themeIcon.classList.replace('fa-moon', 'fa-sun');
                    localStorage.setItem('theme', 'dark');
                }
            });
        }

        function extractSummary(markdown) {
            const plain = markdown
                .replace(/```[\s\S]*?```/g, '')
                .replace(/`[^`]+`/g, '')
                .replace(/^[#>\-*\d\.\s]+/gm, '')
                .split('\n')
                .map(line => line.trim())
                .filter(Boolean);
            if (!plain.length) {
                return '';
            }
            const snippet = plain[0];
            return snippet.length > 160 ? `${snippet.slice(0, 160)}...` : snippet;
        }

        function renderPostList(list) {
            elements.postList.innerHTML = '';
            if (!list.length) {
                elements.emptyState.dataset.state = 'empty';
                updateEmptyStateText();
                elements.emptyState.hidden = false;
                return;
            }
            elements.emptyState.hidden = true;
            list.forEach((post) => {
                const card = document.createElement('article');
                card.className = 'post-card hover-surface';

                const titleBtn = document.createElement('button');
                titleBtn.type = 'button';
                titleBtn.className = 'post-title-btn';
                titleBtn.textContent = post.slug;
                titleBtn.addEventListener('click', () => openPostByIndex(post.index));

                card.appendChild(titleBtn);
                if (post.summary) {
                    const summary = document.createElement('p');
                    summary.className = 'post-summary';
                    summary.textContent = post.summary;
                    card.appendChild(summary);
                }

                elements.postList.appendChild(card);
            });
        }

        function updateFilteredList(keyword) {
            if (!state.loaded) {
                return;
            }
            if (!keyword) {
                state.filtered = [...state.posts];
            } else {
                const query = keyword.toLowerCase();
                state.filtered = state.posts.filter((post) => {
                    const content = `${post.slug} ${post.content}`.toLowerCase();
                    return content.includes(query);
                });
            }
            renderPostList(state.filtered);
            if (state.filtered.length === 0) {
                closeOverlay();
            }
        }

        async function loadPosts() {
            try {
                elements.emptyState.dataset.state = 'loading';
                updateEmptyStateText();
                elements.emptyState.hidden = false;
                const response = await fetch('https://api.github.com/repos/ff66ccff/ff66ccff.github.io/contents/posts');
                if (!response.ok) {
                    throw new Error('Failed to fetch directory listing');
                }
                const files = await response.json();
                const markdownFiles = files.filter(file => file.type === 'file' && file.name.endsWith('.md'));
                const posts = await Promise.all(markdownFiles.map(async (file, index) => {
                    const res = await fetch(`${file.download_url}?cacheBust=${Date.now()}`);
                    if (!res.ok) {
                        throw new Error(`Failed to fetch ${file.name}`);
                    }
                    const content = await res.text();
                    return {
                        index,
                        slug: file.name.replace(/\.md$/, ''),
                        filename: file.name,
                        content,
                        summary: extractSummary(content)
                    };
                }));
                posts.sort((a, b) => b.filename.localeCompare(a.filename));
                posts.forEach((post, index) => {
                    post.index = index;
                });
                state.posts = posts;
                state.filtered = [...posts];
                state.loaded = true;
                renderPostList(state.filtered);
                if (!posts.length) {
                    elements.emptyState.dataset.state = 'empty';
                    updateEmptyStateText();
                    elements.emptyState.hidden = false;
                }
                if (pendingSlug) {
                    const idx = state.posts.findIndex(post => post.slug === pendingSlug);
                    if (idx !== -1) {
                        openPostByIndex(idx);
                    }
                    pendingSlug = null;
                }
            } catch (error) {
                console.error(error);
                state.loaded = false;
                elements.emptyState.dataset.state = 'error';
                updateEmptyStateText();
                elements.emptyState.hidden = false;
            }
        }

        function updateNavigationButtons() {
            const order = state.filtered.length ? state.filtered : state.posts;
            const currentSlug = state.posts[state.currentIndex]?.slug;
            const pointer = order.findIndex(post => post.slug === currentSlug);
            const prev = pointer > 0 ? order[pointer - 1] : null;
            const next = pointer >= 0 && pointer < order.length - 1 ? order[pointer + 1] : null;

            elements.prevPost.disabled = !prev;
            elements.nextPost.disabled = !next;

            elements.prevPost.onclick = prev ? () => openPostByIndex(prev.index) : null;
            elements.nextPost.onclick = next ? () => openPostByIndex(next.index) : null;
        }

        function showOverlay() {
            if (!elements.overlay.hidden) {
                return;
            }
            elements.overlay.hidden = false;
            document.body.classList.add('is-overlay-open');
            elements.closeOverlay.focus({ preventScroll: true });
        }

        function closeOverlay() {
            if (elements.overlay.hidden) {
                return;
            }
            elements.overlay.hidden = true;
            document.body.classList.remove('is-overlay-open');
            state.currentIndex = -1;
            history.replaceState(null, '', window.location.pathname + window.location.search);
        }

        function openPostByIndex(index) {
            if (index < 0 || index >= state.posts.length) {
                return;
            }
            state.currentIndex = index;
            const post = state.posts[index];
            elements.overlayTitle.textContent = post.slug;
            const html = marked.parse(post.content, { gfm: true, breaks: true });
            elements.overlayContent.innerHTML = html;
            Prism.highlightAllUnder(elements.overlayContent);
            updateOverlayMeta();
            showOverlay();
            updateNavigationButtons();
            history.replaceState(null, '', `${window.location.pathname}${window.location.search}#post=${encodeURIComponent(post.slug)}`);
        }

        elements.searchInput.addEventListener('input', (event) => {
            updateFilteredList(event.target.value.trim());
        });

        elements.closeOverlay.addEventListener('click', () => {
            closeOverlay();
        });

        elements.overlay.addEventListener('click', (event) => {
            if (event.target === elements.overlay) {
                closeOverlay();
            }
        });

        elements.scrollTopBtn.addEventListener('click', () => {
            elements.overlayScroll.scrollTo({ top: 0, behavior: 'smooth' });
        });

        elements.scrollBottomBtn.addEventListener('click', () => {
            elements.overlayScroll.scrollTo({ top: elements.overlayScroll.scrollHeight, behavior: 'smooth' });
        });

        window.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                closeOverlay();
            }
        });

        function getSlugFromHash() {
            const hash = window.location.hash;
            if (!hash.startsWith('#post=')) {
                return null;
            }
            return decodeURIComponent(hash.slice(6));
        }

        function handleHashNavigation() {
            const slug = getSlugFromHash();
            if (!slug) {
                closeOverlay();
                return;
            }
            if (!state.loaded) {
                pendingSlug = slug;
                return;
            }
            const index = state.posts.findIndex(post => post.slug === slug);
            if (index !== -1) {
                openPostByIndex(index);
            }
        }

        window.addEventListener('hashchange', handleHashNavigation);

        window.addEventListener('DOMContentLoaded', () => {
            initLanguage();
            initLanguageToggle();
            initTheme();
            loadPosts();
            handleHashNavigation();
        });
    </script>
</body>

</html>
