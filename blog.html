<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客 - ff66ccff</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css">
    <style>
        :root {
            --primary-color: #667eea;
            --secondary-color: #764ba2;
            --accent-blue: #4facfe;
            --accent-pink: #f093fb;
            --accent-cyan: #00d4ff;
            --bg-primary: #e8ecf7;
            --mica-tint: rgba(255, 255, 255, 0.82);
            --mica-tint-strong: rgba(255, 255, 255, 0.9);
            --mica-noise: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(102, 126, 234, 0.16));
            --mica-border: rgba(255, 255, 255, 0.62);
            --reveal-glow: rgba(255, 255, 255, 0.72);
            --text-primary: #1f2937;
            --text-secondary: #475569;
            --text-muted: #6b7280;
            --border-color: rgba(15, 23, 42, 0.12);
            --shadow-sm: 0 12px 32px rgba(15, 23, 42, 0.14);
            --shadow-md: 0 36px 76px rgba(15, 23, 42, 0.18);
            --font-family: 'Segoe UI Variable Display', 'Segoe UI', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
            --safe-area-top: env(safe-area-inset-top, 0px);
            --safe-area-right: env(safe-area-inset-right, 0px);
            --safe-area-bottom: env(safe-area-inset-bottom, 0px);
            --safe-area-left: env(safe-area-inset-left, 0px);
        }

        [data-theme="dark"] {
            --bg-primary: #0d1528;
            --mica-tint: rgba(20, 29, 46, 0.82);
            --mica-tint-strong: rgba(24, 34, 56, 0.9);
            --mica-noise: linear-gradient(135deg, rgba(16, 26, 44, 0.65), rgba(102, 126, 234, 0.22));
            --mica-border: rgba(148, 163, 184, 0.28);
            --reveal-glow: rgba(148, 176, 224, 0.68);
            --text-primary: #f8fafc;
            --text-secondary: #cbd5f5;
            --text-muted: #94a3b8;
            --border-color: rgba(148, 163, 184, 0.3);
            --shadow-sm: 0 16px 42px rgba(8, 15, 35, 0.55);
            --shadow-md: 0 46px 94px rgba(8, 15, 35, 0.7);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: var(--font-family);
            background: var(--bg-primary);
            color: var(--text-primary);
            padding: calc(40px + var(--safe-area-top)) calc(24px + var(--safe-area-right)) calc(72px + var(--safe-area-bottom)) calc(24px + var(--safe-area-left));
            transition: background 0.4s ease, color 0.4s ease;
            position: relative;
            overflow-x: hidden;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: -40vh -40vw;
            pointer-events: none;
            z-index: -2;
        }

        body::before {
            background: var(--mica-noise);
            filter: blur(72px) saturate(120%);
            opacity: 0.95;
        }

        body::after {
            background: rgba(102, 126, 234, 0.08);
            z-index: -1;
            opacity: 0.55;
        }

        body.is-overlay-open {
            overflow: hidden;
            overscroll-behavior: contain;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .page-shell {
            width: 100%;
            max-width: 1080px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .hover-surface {
            position: relative;
            z-index: 0;
            border: 1px solid transparent;
            background-clip: padding-box;
            overflow: hidden;
        }

        .hover-surface::before,
        .hover-surface::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            transition: opacity 0.18s ease;
        }

        .hover-surface::before {
            z-index: -2;
            background: radial-gradient(600px circle at var(--pointer-x, 50%) var(--pointer-y, 50%),
                    rgba(255, 255, 255, 0.06),
                    transparent 40%);
            opacity: 0;
        }

        .hover-surface::after {
            z-index: -1;
            background: radial-gradient(800px circle at var(--pointer-x, 50%) var(--pointer-y, 50%),
                    rgba(102, 126, 234, 0.15),
                    transparent 40%);
            opacity: 0;
        }

        .hover-surface.is-active::before {
            opacity: 0.5;
        }

        .hover-surface.is-active::after {
            opacity: 0.8;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            padding: 24px 30px;
            border-radius: 28px;
            background: var(--mica-tint);
            border: 1px solid var(--mica-border);
            box-shadow: var(--shadow-sm);
            backdrop-filter: blur(26px) saturate(150%);
            -webkit-backdrop-filter: blur(26px) saturate(150%);
        }

        .brand {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            color: var(--primary-color);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .ghost-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 22px;
            border-radius: 18px;
            font-weight: 600;
            color: var(--primary-color);
            background: rgba(102, 126, 234, 0.12);
            border: 1px solid rgba(102, 126, 234, 0.32);
            box-shadow: var(--shadow-sm);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            backdrop-filter: blur(18px) saturate(135%);
            -webkit-backdrop-filter: blur(18px) saturate(135%);
        }

        .ghost-link:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: rgba(102, 126, 234, 0.48);
        }

        .content-card {
            background: var(--mica-tint-strong);
            border-radius: 28px;
            border: 1px solid var(--mica-border);
            padding: 36px;
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
            gap: 28px;
            backdrop-filter: blur(26px) saturate(135%);
            -webkit-backdrop-filter: blur(26px) saturate(135%);
        }

        .panel-header {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .panel-header h1 {
            margin: 0;
            font-size: 2.1rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .panel-header p {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.98rem;
        }

        .search-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            border-radius: 18px;
            border: 1px solid rgba(102, 126, 234, 0.32);
            background: rgba(102, 126, 234, 0.12);
            backdrop-filter: blur(18px) saturate(130%);
            -webkit-backdrop-filter: blur(18px) saturate(130%);
        }

        .search-row i {
            color: var(--primary-color);
        }

        .search-row input {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--text-primary);
            font-size: 0.98rem;
            outline: none;
        }

        .post-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            padding: 6px 2px;
        }

        .post-stats {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 36px;
        }

        .stat-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 999px;
            background: rgba(102, 126, 234, 0.14);
            color: var(--primary-color);
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid rgba(102, 126, 234, 0.32);
            backdrop-filter: blur(16px);
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .filter-list {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-chip {
            border: 1px solid rgba(102, 126, 234, 0.28);
            border-radius: 18px;
            background: rgba(102, 126, 234, 0.1);
            padding: 6px 14px;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .filter-chip:hover {
            transform: translateY(-1px);
            background: rgba(102, 126, 234, 0.16);
            border-color: rgba(102, 126, 234, 0.42);
        }

        .filter-chip.is-active {
            color: var(--primary-color);
            background: rgba(102, 126, 234, 0.22);
            border-color: rgba(102, 126, 234, 0.5);
            box-shadow: var(--shadow-sm);
        }

        .load-more {
            align-self: center;
            margin-top: 8px;
        }

        .scroll-sentinel {
            width: 100%;
            height: 1px;
            pointer-events: none;
        }

        .post-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
            min-height: 0;
        }

        .post-card {
            display: flex;
            flex-direction: column;
            gap: 18px;
            padding: 28px 32px;
            background: var(--mica-tint-strong);
            border-radius: 22px;
            border: 1px solid var(--mica-border);
            box-shadow: var(--shadow-sm);
            transition: transform 0.22s ease, box-shadow 0.22s ease, border 0.22s ease;
            cursor: pointer;
            backdrop-filter: blur(20px) saturate(140%);
            -webkit-backdrop-filter: blur(20px) saturate(140%);
            width: 100%;
            min-height: 170px;
            justify-content: center;
        }

        .post-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
            border-color: rgba(102, 126, 234, 0.42);
        }

        .post-card:focus-visible {
            outline: 2px solid var(--accent-blue);
            outline-offset: 4px;
        }

        .post-title {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--primary-color);
            transition: color 0.2s ease;
            line-height: 1.4;
            padding: 4px 0 2px;
        }

        .post-card:hover .post-title {
            color: var(--accent-blue);
        }

        .post-summary {
            margin: 0;
            color: var(--text-secondary);
            line-height: 1.6;
            font-size: 0.92rem;
        }

        .post-meta {
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .post-scroll-area {
            margin-top: 12px;
            padding: 16px 10px 16px 18px;
            border-radius: 26px;
            border: 1px solid var(--mica-border);
            background: var(--mica-tint);
            box-shadow: var(--shadow-sm);
            backdrop-filter: blur(20px) saturate(135%);
            -webkit-backdrop-filter: blur(20px) saturate(135%);
            max-height: clamp(320px, 62vh, 780px);
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--primary-color) rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .post-scroll-area::-webkit-scrollbar {
            width: 10px;
        }

        .post-scroll-area::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 999px;
        }

        .post-scroll-area::-webkit-scrollbar-thumb {
            border-radius: 999px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: linear-gradient(135deg, var(--primary-color), var(--accent-blue));
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.15);
        }

        .post-scroll-area::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
        }

        .post-meta .meta-row {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .post-meta .meta-label {
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.01em;
            min-width: 88px;
        }

        .post-meta .meta-value {
            color: var(--text-muted);
        }

        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 48px 24px;
            border-radius: 20px;
            border: 1px dashed rgba(102, 126, 234, 0.4);
            color: var(--text-muted);
            font-size: 0.95rem;
            background: rgba(102, 126, 234, 0.1);
            backdrop-filter: blur(16px) saturate(125%);
            min-height: 200px;
        }

        .control-btn {
            position: fixed;
            width: 48px;
            height: 48px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--mica-border);
            background: var(--mica-tint);
            color: var(--text-primary);
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            z-index: 1000;
            backdrop-filter: blur(18px) saturate(140%);
            -webkit-backdrop-filter: blur(18px) saturate(140%);
        }

        .control-btn:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
            border-color: rgba(102, 126, 234, 0.48);
        }

        .theme-toggle {
            top: calc(28px + var(--safe-area-top));
            right: calc(28px + var(--safe-area-right));
        }

        .language-toggle {
            top: calc(28px + var(--safe-area-top));
            left: calc(28px + var(--safe-area-left));
        }

        .language-toggle span {
            font-size: 0.96rem;
            font-weight: 600;
        }

        @keyframes overlayBackdropFadeOut {
            0% {
                opacity: 1;
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px);
            }

            100% {
                opacity: 0;
                backdrop-filter: blur(0);
                -webkit-backdrop-filter: blur(0);
            }
        }

        @keyframes overlayDialogFadeOut {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }

            100% {
                opacity: 0;
                transform: translateY(36px) scale(0.92);
                filter: blur(16px);
            }
        }

        .article-overlay {
            position: fixed;
            inset: 0;
            padding: calc(32px + var(--safe-area-top)) calc(16px + var(--safe-area-right)) calc(32px + var(--safe-area-bottom)) calc(16px + var(--safe-area-left));
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: grid;
            place-items: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.42s cubic-bezier(0.22, 0.7, 0.12, 1), backdrop-filter 0.42s ease;
            overscroll-behavior: contain;
        }

        .article-overlay.is-visible {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .article-overlay.is-closing {
            pointer-events: none;
            animation: overlayBackdropFadeOut 0.52s ease forwards;
        }

        .article-dialog {
            width: min(1040px, 100%);
            height: min(90vh, 860px);
            max-height: calc(100vh - var(--safe-area-top) - var(--safe-area-bottom));
            background: var(--mica-tint-strong);
            border-radius: 28px;
            border: 1px solid var(--mica-border);
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(28px) saturate(140%);
            -webkit-backdrop-filter: blur(28px) saturate(140%);
            transform-origin: var(--origin-x, 50%) var(--origin-y, 50%);
            transform: translateY(28px) scale(0.94);
            opacity: 0;
            filter: blur(0);
            transition: transform 0.5s cubic-bezier(0.19, 0.7, 0.22, 1), opacity 0.36s ease;
            will-change: transform, opacity, filter;
        }

        .article-overlay.is-visible .article-dialog {
            transform: translateY(0) scale(1);
            opacity: 1;
        }

        .article-overlay.is-closing .article-dialog {
            animation: overlayDialogFadeOut 0.52s ease forwards;
        }

        @supports (height: 100dvh) {
            .article-dialog {
                height: min(90dvh, 860px);
                max-height: calc(100dvh - var(--safe-area-top) - var(--safe-area-bottom));
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .article-overlay,
            .article-dialog,
            .overlay-body,
            .overlay-header h2,
            .overlay-meta,
            #overlayTitle,
            #overlayMeta,
            #overlayScroll {
                transition-duration: 0.01ms !important;
                transition-delay: 0ms !important;
            }

            .article-overlay.is-closing,
            .article-overlay.is-closing .article-dialog {
                animation: none !important;
            }
        }

        .overlay-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            padding: 24px 28px 16px;
        }

        .overlay-header h2 {
            margin: 0;
            font-size: 1.7rem;
            font-weight: 700;
            color: var(--text-primary);
            transition: opacity 0.32s ease, transform 0.32s ease;
            will-change: opacity, transform;
        }

        .overlay-meta {
            font-size: 0.9rem;
            color: var(--text-muted);
            transition: opacity 0.32s ease, transform 0.32s ease;
            will-change: opacity, transform;
        }

        #overlayTitle,
        #overlayMeta,
        #overlayScroll {
            transition: opacity 0.32s ease, transform 0.32s ease;
            will-change: opacity, transform;
        }

        #overlayTitle,
        #overlayMeta {
            transform-origin: center left;
        }

        #overlayTitle.is-swapping-out,
        #overlayMeta.is-swapping-out {
            opacity: 0;
            transform: translateY(-12px);
        }

        #overlayScroll.is-swapping-out {
            opacity: 0;
            transform: translateY(18px);
        }

        #overlayTitle.is-swapping-in,
        #overlayMeta.is-swapping-in,
        #overlayScroll.is-swapping-in {
            opacity: 1;
            transform: translateY(0);
        }

        .overlay-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 0 28px 18px;
            flex-wrap: wrap;
        }

        .overlay-nav {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .overlay-body {
            flex: 1;
            overflow-y: auto;
            padding: 0 32px 32px;
            line-height: 1.75;
            color: var(--text-secondary);
            position: relative;
            transition: opacity 0.32s ease, transform 0.32s ease;
            will-change: opacity, transform;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            touch-action: pan-y;
        }

        .overlay-body::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.08), rgba(118, 75, 162, 0.1));
            opacity: 0;
            transition: opacity 0.32s ease;
            pointer-events: none;
        }

        #overlayScroll.is-swapping-out::after,
        #overlayScroll.is-swapping-in::after {
            opacity: 1;
        }


        #overlayContent h1,
        #overlayContent h2,
        #overlayContent h3,
        #overlayContent h4 {
            color: var(--text-primary);
            margin-top: 28px;
            margin-bottom: 14px;
        }

        #overlayContent p,
        #overlayContent ul,
        #overlayContent ol {
            margin-bottom: 16px;
        }

        #overlayContent pre {
            background: rgba(13, 17, 23, 0.88);
            border-radius: 16px;
            padding: 18px 20px;
            overflow-x: auto;
            color: #f8f8f2;
        }

        [data-theme="dark"] #overlayContent pre {
            background: rgba(13, 19, 31, 0.88);
        }

        #overlayContent blockquote {
            border-left: 4px solid var(--primary-color);
            padding-left: 16px;
            margin: 20px 0;
            background: rgba(102, 126, 234, 0.12);
            border-radius: 0 16px 16px 0;
        }

        .ghost-btn,
        .icon-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border-radius: 14px;
            border: 1px solid rgba(102, 126, 234, 0.38);
            background: rgba(102, 126, 234, 0.12);
            color: var(--primary-color);
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease;
            backdrop-filter: blur(16px) saturate(130%);
            -webkit-backdrop-filter: blur(16px) saturate(130%);
        }

        .ghost-btn {
            padding: 10px 20px;
        }

        .ghost-btn:hover,
        .icon-btn:hover {
            background: rgba(102, 126, 234, 0.14);
            transform: translateY(-2px);
        }

        .ghost-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
        }

        .icon-btn {
            padding: 10px 12px;
            border-radius: 50%;
        }

        .article-overlay[hidden] {
            display: none;
        }

        @media (max-width: 900px) {
            .post-list {
                gap: 16px;
            }
        }

        @media (max-width: 720px) {
            body {
                padding: calc(30px + var(--safe-area-top)) calc(14px + var(--safe-area-right)) calc(56px + var(--safe-area-bottom)) calc(14px + var(--safe-area-left));
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 14px;
                padding: 22px 24px;
            }

            .content-card {
                padding: 28px;
            }

            .article-dialog {
                height: calc(100vh - var(--safe-area-top) - var(--safe-area-bottom));
                width: 100%;
                border-radius: 0;
                max-height: none;
            }

            @supports (height: 100dvh) {
                .article-dialog {
                    height: calc(100dvh - var(--safe-area-top) - var(--safe-area-bottom));
                }
            }

            .overlay-header,
            .overlay-toolbar,
            .overlay-body {
                padding-left: 20px;
                padding-right: 20px;
            }

    <script>
        const i18n = {
            zh: {
                blogTitle: "博客",

                searchPlaceholder: "搜索文章标题或内容",

                backHome: "返回首页",
                scrollTop: "回到开头",
                scrollBottom: "前往结尾",
                prevPost: "上一篇",
                nextPost: "下一篇",
                fileLabel: "文件名",
                close: "关闭全文",
                langToggle: "中",
                themeTitle: "切换主题",

            en: {

                searchPlaceholder: "Search by title or contents",

                loading: "Loading posts, please wait...",

                backHome: "Back Home",

                fileLabel: "Filename",
                close: "Close",
                langToggle: "EN",
                themeTitle: "Toggle Theme",
                langTitle: "Switch Language",
                overlayTitle: "Full article",
                pageTitle: "Blog - ff66ccff",
                published: "Published",
                updated: "Updated"
            }
        };

        const elements = {
            themeToggle: document.getElementById('themeToggle'),
            languageToggle: document.getElementById('languageToggle'),
            searchInput: document.getElementById('searchInput'),
            postList: document.getElementById('postList'),
            emptyState: document.getElementById('emptyState'),
            blogTitle: document.getElementById('blogTitle'),
            blogSubtitle: document.getElementById('blogSubtitle'),
            backHomeLabel: document.getElementById('backHomeLabel'),
            backHomeLink: document.getElementById('backHomeLink'),
            overlay: document.getElementById('articleOverlay'),
            articleDialog: document.querySelector('.article-dialog'),
            overlayTitle: document.getElementById('overlayTitle'),

            overlayContent: document.getElementById('overlayContent'),
            overlayScroll: document.getElementById('overlayScroll'),
            closeOverlay: document.getElementById('closeOverlay'),
            scrollTopBtn: document.getElementById('scrollTopBtn'),
            scrollBottomBtn: document.getElementById('scrollBottomBtn'),
            prevPost: document.getElementById('prevPost'),
            nextPost: document.getElementById('nextPost'),
            scrollTopLabel: document.getElementById('scrollTopLabel'),
            scrollBottomLabel: document.getElementById('scrollBottomLabel'),
            prevPostLabel: document.getElementById('prevPostLabel'),
            nextPostLabel: document.getElementById('nextPostLabel')
        };

        const POSTS_DIR = 'posts';
        const METADATA_URL = `${POSTS_DIR}/metadata.json`;
        const REPO_OWNER = 'ff66ccff';
        const REPO_NAME = 'ff66ccff.github.io';
        const CDN_BRANCH = 'main';
        const CDN_BASE = `https://cdn.jsdelivr.net/gh/${REPO_OWNER}/${REPO_NAME}@${CDN_BRANCH}`;
        const CDN_MANIFEST_URL = `https://data.jsdelivr.com/v1/package/gh/${REPO_OWNER}/${REPO_NAME}@${CDN_BRANCH}`;

        const state = {
            posts: [],
            filtered: [],
            currentIndex: -1,
            loaded: false
        };

        const motion = {
            overlayTimer: null,
            swapTimer: null
        };

        const MOTION_DURATIONS = {
            overlay: 520,
            swap: 320
        };

        const revealSurfaces = new WeakSet();

        function bindRevealSurface(surface) {
            if (!surface || revealSurfaces.has(surface)) {
                return;
            }

            const activate = () => surface.classList.add('is-active');
            const deactivate = () => {
                surface.classList.remove('is-active');
            };

            surface.addEventListener('pointerenter', (event) => {
                const rect = surface.getBoundingClientRect();
                surface.style.setProperty('--pointer-x', `${event.clientX - rect.left}px`);
                surface.style.setProperty('--pointer-y', `${event.clientY - rect.top}px`);
                activate();
            });

            surface.addEventListener('pointermove', (event) => {
                const rect = surface.getBoundingClientRect();
                surface.style.setProperty('--pointer-x', `${event.clientX - rect.left}px`);
                surface.style.setProperty('--pointer-y', `${event.clientY - rect.top}px`);
            });

            surface.addEventListener('pointerleave', deactivate);
            surface.addEventListener('pointercancel', deactivate);

            surface.addEventListener('touchstart', (event) => {
                const touch = event.touches && event.touches[0];
                if (!touch) {
                    return;
                }
                const rect = surface.getBoundingClientRect();
                surface.style.setProperty('--pointer-x', `${touch.clientX - rect.left}px`);
                surface.style.setProperty('--pointer-y', `${touch.clientY - rect.top}px`);
                activate();
            }, { passive: true });

            surface.addEventListener('touchend', deactivate);
            surface.addEventListener('touchcancel', deactivate);

            revealSurfaces.add(surface);
        }

        function refreshRevealSurfaces() {
            requestAnimationFrame(() => {
                document.querySelectorAll('.hover-surface').forEach(bindRevealSurface);
            });
        }

        function prefersReducedMotion() {
            try {
                return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            } catch (error) {
                return false;
            }
        }

        function resetSwapState() {
            clearTimeout(motion.swapTimer);
            motion.swapTimer = null;
            [elements.overlayTitle, elements.overlayMeta, elements.overlayScroll].forEach((node) => {
                node?.classList.remove('is-swapping-out', 'is-swapping-in');
            });
        }

        function scrollOverlayToPosition(top, behavior = 'smooth') {
            if (!elements.overlayScroll) {
                return;
            }
            const numericTop = typeof top === 'number' && isFinite(top) ? top : 0;
            const target = Math.max(0, numericTop);
            if (typeof elements.overlayScroll.scrollTo === 'function') {
                try {
                    elements.overlayScroll.scrollTo({ top: target, behavior });
                    return;
                } catch (error) {
                    // Use manual scroll fallback when native options are unsupported.
                }
            }
            elements.overlayScroll.scrollTop = target;
        }

        function resetOverlayScroll(behavior = 'auto') {
            scrollOverlayToPosition(0, behavior);
        }

        function playOverlayContentExitAnimation(reduceMotion = prefersReducedMotion()) {
            const targets = [elements.overlayTitle, elements.overlayMeta, elements.overlayScroll].filter(Boolean);
            if (reduceMotion || !elements.overlay.classList.contains('is-visible') || !targets.length) {
                resetSwapState();
                return 0;
            }

            resetSwapState();
            targets.forEach((node) => node.classList.remove('is-swapping-in'));

            requestAnimationFrame(() => {
                targets.forEach((node) => node.classList.add('is-swapping-out'));
            });

            motion.swapTimer = setTimeout(() => {
                targets.forEach((node) => node.classList.remove('is-swapping-out'));
                motion.swapTimer = null;
            }, MOTION_DURATIONS.swap);

            return MOTION_DURATIONS.swap;
        }

        function getCurrentPost() {
            if (state.currentIndex < 0) {
                return null;
            }
            return state.posts[state.currentIndex] || null;
        }

        function setOverlayContent(post) {
            if (!post) {
                return;
            }
            const displayTitle = post.title || post.slug;
            elements.overlayTitle.textContent = displayTitle;
            const html = marked.parse(post.content, { gfm: true, breaks: true });
            elements.overlayContent.innerHTML = html;
            const leadingHeading = elements.overlayContent.querySelector('h1');
            if (leadingHeading) {
                const headingText = leadingHeading.textContent.trim().toLowerCase();
                const titleText = displayTitle.trim().toLowerCase();
                if (headingText === titleText) {
                    leadingHeading.remove();
                }
            }
            Prism.highlightAllUnder(elements.overlayContent);
            updateOverlayMeta();
        }

        function swapOverlayContent(post) {
            resetSwapState();
            const targets = [elements.overlayTitle, elements.overlayMeta, elements.overlayScroll].filter(Boolean);
            const animate = !prefersReducedMotion() && elements.overlay.classList.contains('is-visible') && targets.length;
            if (!animate) {
                setOverlayContent(post);
                resetOverlayScroll('auto');
                return;
            }

            targets.forEach((node) => node.classList.remove('is-swapping-in'));

            requestAnimationFrame(() => {
                targets.forEach((node) => node.classList.add('is-swapping-out'));
            });

            clearTimeout(motion.swapTimer);
            motion.swapTimer = setTimeout(() => {
                setOverlayContent(post);
                resetOverlayScroll('auto');

                requestAnimationFrame(() => {
                    targets.forEach((node) => {
                        node.classList.remove('is-swapping-out');
                        node.classList.add('is-swapping-in');
                    });

                    clearTimeout(motion.swapTimer);
                    motion.swapTimer = setTimeout(() => {
                        targets.forEach((node) => node.classList.remove('is-swapping-in'));
                        motion.swapTimer = null;
                    }, MOTION_DURATIONS.swap);
                });
            }, MOTION_DURATIONS.swap);
        }

        let currentLang = 'zh';
        let pendingSlug = null;

        function formatDate(dateString) {
            if (!dateString) {
                return '';
            }
            try {
                const locale = currentLang === 'zh' ? 'zh-CN' : 'en-US';
                const options = { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
                const date = new Date(dateString);
                return new Intl.DateTimeFormat(locale, options).format(date);
            } catch (error) {
                return dateString;
            }
        }

        function isSameDay(date1String, date2String) {
            if (!date1String || !date2String) {
                return false;
            }
            try {
                const date1 = new Date(date1String);
                const date2 = new Date(date2String);
                return date1.toDateString() === date2.toDateString();
            } catch (error) {
                return false;
            }
        }

        function isSameTimestamp(date1String, date2String) {
            if (!date1String || !date2String) {
                return false;
            }
            try {
                const date1 = new Date(date1String);
                const date2 = new Date(date2String);
                if (Number.isNaN(date1.getTime()) || Number.isNaN(date2.getTime())) {
                    return date1String === date2String;
                }
                return date1.getTime() === date2.getTime();
            } catch (error) {
                return date1String === date2String;
            }
        }

        function parseFrontMatter(markdown) {
            const frontMatterPattern = /^---\s*[\r\n]+([\s\S]*?)\s*---\s*[\r\n]*/;
            const match = markdown.match(frontMatterPattern);
            if (!match) {
                return { attributes: {}, body: markdown };
            }

            const lines = match[1].split(/\r?\n/);
            const attributes = {};
            let currentKey = null;

            lines.forEach((line) => {
                if (!line.trim()) {
                    return;
                }

                if (/^\s/.test(line) && currentKey) {
                    attributes[currentKey] = `${attributes[currentKey]}\n${line.trim()}`;
                    return;
                }

                const delimiterIndex = line.indexOf(':');
                if (delimiterIndex === -1) {
                    currentKey = null;
                    return;
                }

                currentKey = line.slice(0, delimiterIndex).trim();
                let value = line.slice(delimiterIndex + 1).trim();
                if (value === '|' || value === '|-' || value === '>' || value === '>-') {
                    value = '';
                }
                attributes[currentKey] = value;
            });

            Object.keys(attributes).forEach((key) => {
                const normalized = attributes[key].replace(/^['"]|['"]$/g, '').trim();
                attributes[key] = normalized;
            });

            const body = markdown.slice(match[0].length);
            return { attributes, body };
        }

        function extractTitleFromContent(markdown) {
            const headingMatch = markdown.match(/^#\s+(.+)$/m);
            return headingMatch ? headingMatch[1].trim() : '';
        }

        function stripLeadingTitleHeading(markdown, title) {
            if (!markdown || !title) {
                return markdown;
            }
            const headingPattern = /^\s*#\s+([^\n]+)\s*(?:\r?\n)+/;
            const match = markdown.match(headingPattern);
            if (!match) {
                return markdown;
            }
            const headingText = match[1].trim();
            if (headingText.toLowerCase() !== title.trim().toLowerCase()) {
                return markdown;
            }
            const stripped = markdown.slice(match[0].length);
            return stripped.replace(/^\s+/, '');
        }

        function buildPostUrl(filename, cacheKey) {
            const encodedSegments = filename.split('/').map((segment) => encodeURIComponent(segment));
            const baseUrl = `${POSTS_DIR}/${encodedSegments.join('/')}`;
            return cacheKey ? `${baseUrl}?v=${encodeURIComponent(cacheKey)}` : baseUrl;
        }

        function buildCdnFileUrl(filename, hash) {
            const encodedSegments = filename.split('/').map((segment) => encodeURIComponent(segment));
            const baseUrl = `${CDN_BASE}/${POSTS_DIR}/${encodedSegments.join('/')}`;
            return hash ? `${baseUrl}?v=${encodeURIComponent(hash)}` : baseUrl;
        }

        function getBrowserLanguage() {
            const lang = navigator.language || navigator.userLanguage || '';
            return lang.toLowerCase().startsWith('zh') ? 'zh' : 'en';
        }

        function updateEmptyStateText() {
            const t = i18n[currentLang];
            const status = elements.emptyState.dataset.state || 'empty';
            if (status === 'loading') {
                elements.emptyState.textContent = t.loading;
            } else if (status === 'error') {
                elements.emptyState.textContent = t.error;
            } else if (status === 'empty') {
                elements.emptyState.textContent = t.empty;
            } else {
                elements.emptyState.textContent = '';
            }
        }

        function showEmptyState(state) {
            elements.emptyState.dataset.state = state;
            updateEmptyStateText();
            elements.emptyState.hidden = false;
        }

        function hideEmptyState() {
            elements.emptyState.dataset.state = 'idle';
            updateEmptyStateText();
            elements.emptyState.hidden = true;
        }

        function updateOverlayMeta() {
            const post = getCurrentPost();
            if (!post) {
                elements.overlayMeta.textContent = '';
                return;
            }
            const t = i18n[currentLang];
            const parts = [];

            const sameTimestamp = isSameTimestamp(post.createdAt, post.updatedAt);
            if (post.createdAt) {
                parts.push(`${t.published}: ${formatDate(post.createdAt)}`);
            }
            if (post.updatedAt && !sameTimestamp) {
                parts.push(`${t.updated}: ${formatDate(post.updatedAt)}`);
            }

            elements.overlayMeta.textContent = parts.join(' · ');
        }

        function setLanguage(lang) {
            currentLang = lang;
            const t = i18n[lang];
            document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en-US';
            document.title = t.pageTitle;
            elements.blogTitle.textContent = t.blogTitle;
            elements.blogSubtitle.textContent = t.blogSubtitle;
            elements.searchInput.placeholder = t.searchPlaceholder;
            elements.backHomeLabel.textContent = t.backHome;
            elements.languageToggle.querySelector('span').textContent = t.langToggle;
            elements.themeToggle.title = t.themeTitle;
            elements.languageToggle.title = t.langTitle;
            elements.scrollTopLabel.textContent = t.scrollTop;
            elements.scrollBottomLabel.textContent = t.scrollBottom;
            elements.prevPostLabel.textContent = t.prevPost;
            elements.nextPostLabel.textContent = t.nextPost;
            elements.closeOverlay.title = t.close;
            updateEmptyStateText();
            updateOverlayMeta();
            if (state.loaded) {
                const keyword = elements.searchInput.value.trim();
                const listToRender = keyword ? state.filtered : state.posts;
                renderPostList(listToRender);
            }
            localStorage.setItem('language', lang);
        }

        function initLanguage() {
            const savedLang = localStorage.getItem('language');
            const langToUse = savedLang === 'zh' || savedLang === 'en' ? savedLang : getBrowserLanguage();
            setLanguage(langToUse);
        }

        function initLanguageToggle() {
            elements.languageToggle.addEventListener('click', () => {
                const next = currentLang === 'zh' ? 'en' : 'zh';
                setLanguage(next);
            });
        }

        function initTheme() {
            const themeIcon = elements.themeToggle.querySelector('i');
            const saved = localStorage.getItem('theme');
            if (saved === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeIcon.classList.replace('fa-moon', 'fa-sun');
            }
            elements.themeToggle.addEventListener('click', () => {
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                if (isDark) {
                    document.documentElement.removeAttribute('data-theme');
                    themeIcon.classList.replace('fa-sun', 'fa-moon');
                    localStorage.setItem('theme', 'light');
                } else {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    themeIcon.classList.replace('fa-moon', 'fa-sun');
                    localStorage.setItem('theme', 'dark');
                }
            });
        }

        function extractSummary(markdown) {
            const plain = markdown
                .replace(/```[\s\S]*?```/g, '')
                .replace(/`[^`]+`/g, '')
                .replace(/^[#>\-*\d\.\s]+/gm, '')
                .split('\n')
                .map(line => line.trim())
                .filter(Boolean);
            if (!plain.length) {
                return '';
            }
            const snippet = plain[0];
            return snippet.length > 160 ? `${snippet.slice(0, 160)}...` : snippet;
        }

        function renderPostList(list) {
            elements.postList.innerHTML = '';
            if (!list.length) {
                showEmptyState('empty');
                return;
            }
            hideEmptyState();
            list.forEach((post) => {
                const card = document.createElement('article');
                card.className = 'post-card hover-surface';
                card.tabIndex = 0;
                card.setAttribute('role', 'button');
                const displayTitle = post.title || post.slug;
                card.setAttribute('aria-label', displayTitle);
                card.addEventListener('click', (event) => {
                    const origin = event && typeof event.clientX === 'number' ? { x: event.clientX, y: event.clientY } : null;
                    openPostByIndex(post.index, origin);
                });
                card.addEventListener('keydown', (event) => {
                    if (event.key === 'Enter' || event.key === ' ') {
                        event.preventDefault();
                        openPostByIndex(post.index);
                    }
                });

                const title = document.createElement('h2');
                title.className = 'post-title';
                title.textContent = displayTitle;
                card.appendChild(title);

                const t = i18n[currentLang];
                const metaRows = [];
                const sameTimestamp = isSameTimestamp(post.createdAt, post.updatedAt);

                if (post.createdAt) {
                    const publishedValue = formatDate(post.createdAt);
                    if (publishedValue) {
                        metaRows.push({ label: t.published, value: publishedValue });
                    }
                }

                if (post.updatedAt && !sameTimestamp) {
                    const updatedValue = formatDate(post.updatedAt);
                    if (updatedValue) {
                        metaRows.push({ label: t.updated, value: updatedValue });
                    }
                }

                if (metaRows.length) {
                    const meta = document.createElement('div');
                    meta.className = 'post-meta';

                    metaRows.forEach(({ label, value }) => {
                        const row = document.createElement('span');
                        row.className = 'meta-row';

                        const labelNode = document.createElement('span');
                        labelNode.className = 'meta-label';
                        labelNode.textContent = label;

                        const valueNode = document.createElement('span');
                        valueNode.className = 'meta-value';
                        valueNode.textContent = value;

                        row.append(labelNode, valueNode);
                        meta.appendChild(row);
                    });

                    card.appendChild(meta);
                }

                elements.postList.appendChild(card);
            });
            refreshRevealSurfaces();
        }

        function updateFilteredList(keyword) {
            if (!state.loaded) {
                return;
            }
            if (!keyword) {
                state.filtered = [...state.posts];
            } else {
                const query = keyword.toLowerCase();
                state.filtered = state.posts.filter((post) => {
                    const content = `${post.slug} ${post.title || ''} ${post.summary || ''} ${post.content}`.toLowerCase();
                    return content.includes(query);
                });
            }
            renderPostList(state.filtered);
            if (state.filtered.length === 0) {
                closeOverlay();
                return;
            }
            if (state.currentIndex >= 0) {
                const visible = state.filtered.some(post => post.index === state.currentIndex);
                if (!visible) {
                    closeOverlay();
                } else {
                    updateNavigationButtons();
                }
            }
        }

        async function fetchLocalMetadataEntries() {
            try {
                const response = await fetch(METADATA_URL, { cache: 'no-store' });
                if (!response.ok) {
                    return null;
                }
                const payload = await response.json();
                const posts = Array.isArray(payload?.posts) ? payload.posts : [];
                if (!posts.length) {
                    return null;
                }
                return posts.map((item) => ({
                    slug: item.slug || null,
                    filename: item.filename || item.name || null,
                    title: item.title || null,
                    published: item.published || null,
                    updated: item.updated || null,
                    summary: item.summary || null,
                    origin: 'local',
                    url: item.filename ? buildPostUrl(item.filename, item.updated || item.published || null) : null
                })).filter(entry => entry.filename && entry.slug && entry.url);
            } catch (error) {
                console.warn('Failed to read local metadata manifest:', error);
                return null;
            }
        }

        async function fetchCdnManifestEntries() {
            const response = await fetch(CDN_MANIFEST_URL, { cache: 'no-store' });
            if (!response.ok) {
                throw new Error('Failed to fetch CDN posts manifest');
            }
            const manifest = await response.json();
            const files = Array.isArray(manifest?.files) ? manifest.files : [];
            const postsDirectory = files.find((entry) => entry.type === 'directory' && entry.name === POSTS_DIR);
            if (!postsDirectory || !Array.isArray(postsDirectory.files)) {
                throw new Error('Posts directory missing in CDN manifest');
            }
            return postsDirectory.files
                .filter((file) => file.type === 'file' && file.name.endsWith('.md'))
                .map((file) => ({
                    slug: file.name.replace(/\.md$/, ''),
                    filename: file.name,
                    title: null,
                    published: null,
                    updated: null,
                    summary: null,
                    origin: 'cdn',
                    url: buildCdnFileUrl(file.name, file.hash)
                }));
        }

        async function loadPosts() {
            try {
                showEmptyState('loading');
                let manifestEntries = await fetchLocalMetadataEntries();
                if (!manifestEntries || !manifestEntries.length) {
                    manifestEntries = await fetchCdnManifestEntries();
                }
                if (!manifestEntries.length) {
                    throw new Error('No posts found in manifest');
                }
                const posts = [];

                for (const entry of manifestEntries) {
                    const filename = entry.filename || `${entry.slug}.md`;
                    const fetchUrl = entry.url || buildPostUrl(filename, entry.updated || entry.published || null);
                    const markdownResponse = await fetch(fetchUrl, { cache: 'no-store' });
                    if (!markdownResponse.ok) {
                        throw new Error(`Failed to fetch ${filename}`);
                    }
                    const rawMarkdown = await markdownResponse.text();
                    const { attributes, body } = parseFrontMatter(rawMarkdown);
                    const slug = entry.slug || attributes.slug || filename.replace(/\.md$/, '');
                    let contentBody = body;
                    const derivedTitle = extractTitleFromContent(contentBody);
                    const title = entry.title || attributes.title || derivedTitle || slug;
                    contentBody = stripLeadingTitleHeading(contentBody, title);
                    const summaryText = entry.summary || attributes.summary || extractSummary(contentBody);
                    const createdAt = entry.published || attributes.published || attributes.date || null;
                    const updatedAt = entry.updated || attributes.updated || attributes.modified || createdAt;

                    posts.push({
                        slug,
                        filename,
                        title,
                        content: contentBody,
                        summary: summaryText,
                        createdAt: createdAt || null,
                        updatedAt: updatedAt || null
                    });
                }

                posts.sort((a, b) => {
                    const aTime = a.updatedAt ? Date.parse(a.updatedAt) : (a.createdAt ? Date.parse(a.createdAt) : 0);
                    const bTime = b.updatedAt ? Date.parse(b.updatedAt) : (b.createdAt ? Date.parse(b.createdAt) : 0);
                    if (bTime !== aTime) {
                        return bTime - aTime;
                    }
                    return a.title.localeCompare(b.title, undefined, { sensitivity: 'base' }) || a.slug.localeCompare(b.slug);
                });
                posts.forEach((post, index) => {
                    post.index = index;
                });
                state.posts = posts;
                state.filtered = [...posts];
                state.loaded = true;
                renderPostList(state.filtered);
                if (pendingSlug) {
                    const idx = state.posts.findIndex(post => post.slug === pendingSlug);
                    if (idx !== -1) {
                        openPostByIndex(idx);
                    }
                    pendingSlug = null;
                }
            } catch (error) {
                console.error(error);
                state.loaded = false;
                showEmptyState('error');
            }
        }

        function updateNavigationButtons() {
            if (!elements.prevPost || !elements.nextPost) {
                return;
            }
            const current = getCurrentPost();
            if (!current) {
                elements.prevPost.disabled = true;
                elements.prevPost.onclick = null;
                elements.nextPost.disabled = true;
                elements.nextPost.onclick = null;
                return;
            }

            const order = state.filtered.length ? state.filtered : state.posts;
            const pointer = order.findIndex((post) => post.slug === current.slug);
            const prev = pointer > 0 ? order[pointer - 1] : null;
            const next = pointer >= 0 && pointer < order.length - 1 ? order[pointer + 1] : null;

            elements.prevPost.disabled = !prev;
            elements.nextPost.disabled = !next;

            elements.prevPost.onclick = prev ? () => openPostByIndex(prev.index) : null;
            elements.nextPost.onclick = next ? () => openPostByIndex(next.index) : null;
        }

        function showOverlay(origin) {
            if (elements.overlay.classList.contains('is-visible')) {
                return;
            }

            clearTimeout(motion.overlayTimer);
            motion.overlayTimer = null;
            resetSwapState();
            elements.overlay.classList.remove('is-closing');
            elements.overlay.hidden = false;
            document.body.classList.add('is-overlay-open');

            if (origin && elements.articleDialog) {
                const dialogRect = elements.articleDialog.getBoundingClientRect();
                if (dialogRect.width && dialogRect.height) {
                    const clamp = (value) => Math.max(0, Math.min(100, value));
                    const originX = clamp(((origin.x - dialogRect.left) / dialogRect.width) * 100);
                    const originY = clamp(((origin.y - dialogRect.top) / dialogRect.height) * 100);
                    elements.articleDialog.style.setProperty('--origin-x', `${originX}%`);
                    elements.articleDialog.style.setProperty('--origin-y', `${originY}%`);
                }
            } else if (elements.articleDialog) {
                elements.articleDialog.style.removeProperty('--origin-x');
                elements.articleDialog.style.removeProperty('--origin-y');
            }

            requestAnimationFrame(() => {
                elements.overlay.classList.add('is-visible');
            });

            const focusDelay = prefersReducedMotion() ? 20 : MOTION_DURATIONS.overlay;
            motion.overlayTimer = setTimeout(() => {
                motion.overlayTimer = null;
                if (!elements.overlay.classList.contains('is-visible')) {
                    return;
                }
                if (elements.closeOverlay) {
                    elements.closeOverlay.focus({ preventScroll: true });
                }
            }, focusDelay);
        }

        function closeOverlay() {
            if (!elements.overlay.classList.contains('is-visible') && elements.overlay.hidden) {
                clearTimeout(motion.overlayTimer);
                motion.overlayTimer = null;
                resetSwapState();
                state.currentIndex = -1;
                history.replaceState(null, '', window.location.pathname + window.location.search);
                document.body.classList.remove('is-overlay-open');
                return;
            }

            clearTimeout(motion.overlayTimer);
            motion.overlayTimer = null;
            const reduceMotion = prefersReducedMotion();
            const exitDuration = playOverlayContentExitAnimation(reduceMotion);

            elements.overlay.classList.add('is-closing');

            const finalize = () => {
                resetSwapState();
                elements.overlay.hidden = true;
                elements.overlay.classList.remove('is-closing');
                elements.overlay.classList.remove('is-visible');
                if (elements.articleDialog) {
                    elements.articleDialog.style.removeProperty('--origin-x');
                    elements.articleDialog.style.removeProperty('--origin-y');
                }
                resetOverlayScroll('auto');
            };

            const duration = reduceMotion ? 0 : Math.max(MOTION_DURATIONS.overlay, exitDuration);
            if (duration === 0) {
                finalize();
            } else {
                motion.overlayTimer = setTimeout(() => {
                    finalize();
                    motion.overlayTimer = null;
                }, duration);
            }

            document.body.classList.remove('is-overlay-open');
            state.currentIndex = -1;
            history.replaceState(null, '', window.location.pathname + window.location.search);
        }

        function openPostByIndex(index, origin) {
            if (index < 0 || index >= state.posts.length) {
                return;
            }
            const previousIndex = state.currentIndex;
            state.currentIndex = index;
            const post = state.posts[index];
            const overlayAlreadyVisible = elements.overlay.classList.contains('is-visible');

            if (overlayAlreadyVisible && previousIndex === index) {
                updateOverlayMeta();
                resetOverlayScroll(prefersReducedMotion() ? 'auto' : 'smooth');
                showOverlay(origin);
                updateNavigationButtons();
                history.replaceState(null, '', `${window.location.pathname}${window.location.search}#post=${encodeURIComponent(post.slug)}`);
                return;
            }

            if (overlayAlreadyVisible) {
                swapOverlayContent(post);
            } else {
                setOverlayContent(post);
                resetOverlayScroll('auto');
            }

            showOverlay(origin);
            updateNavigationButtons();
            history.replaceState(null, '', `${window.location.pathname}${window.location.search}#post=${encodeURIComponent(post.slug)}`);
        }

        elements.searchInput.addEventListener('input', (event) => {
            updateFilteredList(event.target.value.trim());
        });

        elements.closeOverlay.addEventListener('click', () => {
            closeOverlay();
        });

        elements.overlay.addEventListener('click', (event) => {
            if (event.target === elements.overlay) {
                closeOverlay();
            }
        });

        elements.scrollTopBtn.addEventListener('click', () => {
            scrollOverlayToPosition(0, 'smooth');
        });

        elements.scrollBottomBtn.addEventListener('click', () => {
            scrollOverlayToPosition(elements.overlayScroll.scrollHeight, 'smooth');
        });

        window.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                closeOverlay();
            }
        });

        function getSlugFromHash() {
            const hash = window.location.hash;
            if (!hash.startsWith('#post=')) {
                return null;
            }
            return decodeURIComponent(hash.slice(6));
        }

        function handleHashNavigation() {
            const slug = getSlugFromHash();
            if (!slug) {
                closeOverlay();
                return;
            }
            if (!state.loaded) {
                pendingSlug = slug;
                return;
            }
            const index = state.posts.findIndex(post => post.slug === slug);
            if (index !== -1) {
                openPostByIndex(index);
            }
        }

        window.addEventListener('hashchange', handleHashNavigation);

        window.addEventListener('DOMContentLoaded', () => {
            initLanguage();
            initLanguageToggle();
            initTheme();
            refreshRevealSurfaces();
            loadPosts();
            handleHashNavigation();
        });
    </script>
</body>

</html>
