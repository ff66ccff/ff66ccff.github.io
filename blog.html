<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客 - ff66ccff</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="container" style="padding-top: 80px;">
        <header class="site-header">
            <a href="index.html" class="brand">ff66ccff's blog</a>
            <nav class="nav-links">
                <a href="index.html" class="nav-link">首页</a>
                <a href="blog.html" class="nav-link active">博客</a>
                <a href="https://github.com/ff66ccff" target="_blank" class="nav-link">GitHub</a>
                <button id="theme-toggle" class="btn btn-icon" aria-label="Toggle theme">
                    <i class="fas fa-moon"></i>
                </button>
            </nav>
        </header>

        <main id="app">
            <!-- Loading State -->
            <div id="loading" class="loading">
                <i class="fas fa-spinner fa-spin"></i> 加载中...
            </div>

            <!-- Post List View -->
            <div id="postList" class="post-list hidden">
                <!-- Posts will be injected here -->
            </div>

            <!-- Article View -->
            <div id="articleView" class="article-view-wrapper hidden">
                <div class="article-sidebar">
                    <img src="avatar.jpg" alt="Author" class="article-avatar">
                </div>
                <div class="article-main">
                    <div class="article-author-info">
                        <span class="author-name">ff66ccff</span>
                        <span class="author-badge">极个别同志</span>
                        <span id="articleMeta" class="article-meta"></span>
                    </div>
                    <article class="article-container">
                        <header class="article-header">
                            <button id="backBtn" class="btn btn-sm" style="margin-bottom: 10px;">
                                <i class="fas fa-arrow-left"></i> 返回
                            </button>
                            <h1 id="articleTitle" class="article-title"></h1>
                        </header>
                        <div id="articleContent" class="markdown-body"></div>

                        <nav id="postNav" class="post-nav hidden">
                            <a id="prevPost" class="post-nav-btn prev">
                                <span class="post-nav-label">上一篇</span>
                                <span class="post-nav-title"></span>
                            </a>
                            <a id="nextPost" class="post-nav-btn next">
                                <span class="post-nav-label">下一篇</span>
                                <span class="post-nav-title"></span>
                            </a>
                        </nav>
                    </article>
                </div>
            </div>
        </main>
    </div>

    <!-- Lightbox (Removed custom implementation for medium-zoom) -->

    <script src="https://cdn.jsdelivr.net/npm/medium-zoom@1.0.6/dist/medium-zoom.min.js"></script>
    <script src="scripts/theme.js"></script>
    <script type="module" src="scripts/blog.js"></script>
</body>

</html>
