            zh: {
                name: "ff66ccff",
                    subtitle: "四川大学 25级计算机学生",
                    viewProfile: "查看我的 GitHub",
                    viewBlog: "进入博客",
                    interestsTitle: "我的兴趣",
                    codingTitle: "编程",
                    codingSubtitle: "Programming",
                    vocaloidTitle: "中文 VOCALOID",
                    vocaloidSubtitle: "Chinese Vocaloid",
                    scifiTitle: "科幻小说",
                    scifiSubtitle: "Sci-Fi Novels",
                    langToggle: "中",
                    themeTitle: "切换主题",
                    langTitle: "切换语言"
            }

            ,
            en: {
                name: "ff66ccff",
                    subtitle: "Computer Science Student, Class of 2025, Sichuan University",
                    viewProfile: "View My GitHub",
                    viewBlog: "Visit Blog",
                    interestsTitle: "My Interests",
                    codingTitle: "Programming",
                    codingSubtitle: "Code & Dev",
                    vocaloidTitle: "Chinese VOCALOID",
                    vocaloidSubtitle: "Music & Voice Synth",
                    scifiTitle: "Sci-Fi Novels",
                    scifiSubtitle: "Science Fiction",
                    langToggle: "EN",
                    themeTitle: "Toggle Theme",
                    langTitle: "Switch Language"
            }
        }

        ;

        const elements= {
            name: document.getElementById('name'),
                subtitle: document.getElementById('subtitle'),
                viewProfile: document.getElementById('viewProfile'),
                viewBlog: document.getElementById('viewBlog'),
                interestsTitle: document.getElementById('interestsTitle'),
                codingTitle: document.getElementById('codingTitle'),
                codingSubtitle: document.getElementById('codingSubtitle'),
                vocaloidTitle: document.getElementById('vocaloidTitle'),
                vocaloidSubtitle: document.getElementById('vocaloidSubtitle'),
                scifiTitle: document.getElementById('scifiTitle'),
                scifiSubtitle: document.getElementById('scifiSubtitle'),
                languageToggle: document.getElementById('languageToggle'),
                themeToggle: document.getElementById('themeToggle')
        }

        ;

        let currentLang='zh';

        function getBrowserLanguage() {
            const lang=navigator.language || navigator.userLanguage;
            return lang && lang.startsWith ('zh') ? 'zh': 'en';
        }

        function setLanguage(lang) {
            currentLang=lang;
            const t=i18n[lang];
            document.documentElement.lang=lang==='zh' ? 'zh-CN': 'en-US';
            elements.name.textContent=t.name;
            elements.subtitle.textContent=t.subtitle;
            elements.viewProfile.textContent=t.viewProfile;
            elements.viewBlog.textContent=t.viewBlog;
            elements.interestsTitle.textContent=t.interestsTitle;
            elements.codingTitle.textContent=t.codingTitle;
            elements.codingSubtitle.textContent=t.codingSubtitle;
            elements.vocaloidTitle.textContent=t.vocaloidTitle;
            elements.vocaloidSubtitle.textContent=t.vocaloidSubtitle;
            elements.scifiTitle.textContent=t.scifiTitle;
            elements.scifiSubtitle.textContent=t.scifiSubtitle;
            elements.languageToggle.querySelector('span').textContent=t.langToggle;
            elements.themeToggle.title=t.themeTitle;
            elements.languageToggle.title=t.langTitle;
            localStorage.setItem('language', lang);
        }

        const savedLang=localStorage.getItem('language') || getBrowserLanguage();
        setLanguage(savedLang);

        elements.languageToggle.addEventListener('click', ()=> {
                const nextLang=currentLang==='zh' ? 'en' : 'zh';
                setLanguage(nextLang);
            });

        const themeToggle=elements.themeToggle;
        const themeIcon=themeToggle.querySelector('i');
        const savedTheme=localStorage.getItem('theme');

        if (savedTheme==='dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }

        themeToggle.addEventListener('click', ()=> {
                const currentTheme=document.documentElement.getAttribute('data-theme');

                if (currentTheme==='dark') {
                    document.documentElement.removeAttribute('data-theme');
                    themeIcon.classList.replace('fa-sun', 'fa-moon');
                    localStorage.setItem('theme', 'light');
                }

                else {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    themeIcon.classList.replace('fa-moon', 'fa-sun');
                    localStorage.setItem('theme', 'dark');
                }
            });

        function loadAvatar() {
            const avatarImage=document.getElementById('avatarImage');
            const avatarIcon=document.querySelector('.avatar-icon');

            if ( !avatarImage || !avatarIcon) {
                return;
            }

            const showImage=()=> {
                avatarImage.style.display='block';
                avatarIcon.style.display='none';
            }

            ;

            const showFallback=()=> {
                avatarImage.style.display='none';
                avatarIcon.style.display='flex';
            }

            ;

            avatarImage.addEventListener('load', showImage);
            avatarImage.addEventListener('error', showFallback);

            if (avatarImage.complete) {
                if (avatarImage.naturalWidth > 0) {
                    showImage();
                }

                else {
                    showFallback();
                }
            }

            else {
                showFallback();
            }
        }

        function initPointerHighlights() {
            const surfaces=document.querySelectorAll('.hover-surface');
            const bodyEl=document.body;

            const setBackgroundGlow=(x, y)=> {
                bodyEl.style.setProperty('--bg-pointer-opacity', '1');

                bodyEl.style.setProperty('--bg-pointer-x', `$ {
                        x
                    }

                    px`);

                bodyEl.style.setProperty('--bg-pointer-y', `$ {
                        y
                    }

                    px`);
            }

            ;

            const hideBackgroundGlow=()=> {
                bodyEl.style.setProperty('--bg-pointer-opacity', '0');
            }

            ;

            const updateBackgroundFromPosition=(x, y, target)=> {
                const hoveringSurface=target && typeof target.closest==='function'
                ? target.closest('.hover-surface'): null;

                if (hoveringSurface) {
                    hideBackgroundGlow();
                }

                else {
                    setBackgroundGlow(x, y);
                }
            }

            ;

            document.addEventListener('pointermove', (event)=> {
                    if (event.pointerType==='touch') {
                        return;
                    }

                    updateBackgroundFromPosition(event.clientX, event.clientY, event.target);
                });

            document.addEventListener('pointerleave', (event)=> {
                    if ( !event.relatedTarget) {
                        hideBackgroundGlow();
                    }
                });

            window.addEventListener('blur', hideBackgroundGlow);

            const handleGlobalTouchMove=(event)=> {
                const touch=event.touches && event.touches[0];

                if ( !touch) {
                    hideBackgroundGlow();
                    return;
                }

                const targetElement=document.elementFromPoint ? document.elementFromPoint(touch.clientX, touch.clientY) : event.target;
                updateBackgroundFromPosition(touch.clientX, touch.clientY, targetElement);
            }

            ;

            document.addEventListener('touchmove', handleGlobalTouchMove, {
                passive: true
            });
        document.addEventListener('touchend', hideBackgroundGlow);
        document.addEventListener('touchcancel', hideBackgroundGlow);

        const activateSurface=(surface)=> {
            surface.classList.add('is-active');
            hideBackgroundGlow();
        }

        ;

        const deactivateSurface=(surface)=> {
            surface.classList.remove('is-active');
            surface.style.removeProperty('--pointer-x');
            surface.style.removeProperty('--pointer-y');
        }

        ;

        surfaces.forEach((surface)=> {
                surface.addEventListener('pointerenter', ()=> {
                        activateSurface(surface);
                    });

                surface.addEventListener('pointermove', (event)=> {
                        const rect=surface.getBoundingClientRect();
                        const x=event.clientX - rect.left;
                        const y=event.clientY - rect.top;

                        surface.style.setProperty('--pointer-x', `$ {
                                x
                            }

                            px`);

                        surface.style.setProperty('--pointer-y', `$ {
                                y
                            }

                            px`);
                        surface.classList.add('is-active');
                    });

                surface.addEventListener('pointerleave', ()=> {
                        deactivateSurface(surface);
                    });

                surface.addEventListener('touchstart', (event)=> {
                        const touch=event.touches && event.touches[0];

                        if ( !touch) {
                            return;
                        }

                        activateSurface(surface);
                        const rect=surface.getBoundingClientRect();

                        surface.style.setProperty('--pointer-x', `$ {
                                touch.clientX - rect.left
                            }

                            px`);

                        surface.style.setProperty('--pointer-y', `$ {
                                touch.clientY - rect.top
                            }

                            px`);
                    }

                    , {
                    passive: true
                });

            surface.addEventListener('touchmove', (event)=> {
                    const touch=event.touches && event.touches[0];

                    if ( !touch) {
                        return;
                    }

                    const rect=surface.getBoundingClientRect();

                    surface.style.setProperty('--pointer-x', `$ {
                            touch.clientX - rect.left
                        }

                        px`);

                    surface.style.setProperty('--pointer-y', `$ {
                            touch.clientY - rect.top
                        }

                        px`);
                }

                , {
                passive: true
            });

        const endTouch=()=> {
            deactivateSurface(surface);
            hideBackgroundGlow();
        }

        ;

        surface.addEventListener('touchend', endTouch);
        surface.addEventListener('touchcancel', endTouch);
        });
        }

        window.addEventListener('DOMContentLoaded', ()=> {
                loadAvatar();
                initPointerHighlights();
            });
        </script></body></html>justify-content: space-between;

        #articleContent blockquote {

        <span>中</span>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script>
        const i18n = {
            zh: {
                name: "ff66ccff",
                subtitle: "四川大学 25级计算机学生",
                viewProfile: "查看我的 GitHub",
                viewProfileBlog: "查看我的 GitHub",
                viewBlog: "进入博客",
                interestsTitle: "我的兴趣",
                codingTitle: "编程",
                codingSubtitle: "Programming",
                vocaloidTitle: "中文 VOCALOID",
                vocaloidSubtitle: "Chinese Vocaloid",
                scifiTitle: "科幻小说",
                scifiSubtitle: "Sci-Fi Novels",
                blogTitle: "博客",
                blogSubtitle: "记录代码、音乐和故事",
                searchPlaceholder: "搜索文章标题或内容",
                backHome: "返回首页",
                backToList: "返回列表",
                prevPost: "上一篇",
                nextPost: "下一篇",
                empty: "没有找到相关文章，换个关键词试试？",
                loading: "文章加载中，请稍候...",
                error: "文章加载失败，请稍后再试。",
                fileLabel: "文件名",
                langToggle: "中",
                themeTitle: "切换主题",
                langTitle: "切换语言"
            },
            en: {
                name: "ff66ccff",
                subtitle: "Computer Science Student, Class of 2025, Sichuan University",
                viewProfile: "View My GitHub",
                viewProfileBlog: "View My GitHub",
                viewBlog: "Visit Blog",
                interestsTitle: "My Interests",
                codingTitle: "Programming",
                codingSubtitle: "Code & Dev",
                vocaloidTitle: "Chinese VOCALOID",
                vocaloidSubtitle: "Music & Voice Synth",
                scifiTitle: "Sci-Fi Novels",
                scifiSubtitle: "Science Fiction",
                blogTitle: "Blog",
                blogSubtitle: "Notes on code, music, and stories",
                searchPlaceholder: "Search by title or contents",
                backHome: "Back Home",
                backToList: "Back to List",
                prevPost: "Previous",
                nextPost: "Next",
                empty: "No posts matched. Try different keywords?",
                loading: "Loading posts, please wait...",
                error: "Failed to load posts. Please try again later.",
                fileLabel: "Filename",
                langToggle: "EN",
                themeTitle: "Toggle Theme",
                langTitle: "Switch Language"
            }
        };

        const elements = {
            profileCard: document.getElementById('profileCard'),
            blogCard: document.getElementById('blogCard'),
            blogButton: document.getElementById('blogButton'),
            backHomeButton: document.getElementById('backHomeButton'),
            searchInput: document.getElementById('searchInput'),
            postList: document.getElementById('postList'),
            articlePanel: document.getElementById('articlePanel'),
            articleTitle: document.getElementById('articleTitle'),
            articleMeta: document.getElementById('articleMeta'),
            articleContent: document.getElementById('articleContent'),
            emptyState: document.getElementById('emptyState'),
            backToList: document.getElementById('backToList'),
            prevPost: document.getElementById('prevPost'),
            nextPost: document.getElementById('nextPost'),
            blogTitle: document.getElementById('blogTitle'),
            blogSubtitle: document.getElementById('blogSubtitle'),
            backHomeLabel: document.getElementById('backHomeLabel'),
            backToListLabel: document.getElementById('backToListLabel'),
            prevPostLabel: document.getElementById('prevPostLabel'),
            nextPostLabel: document.getElementById('nextPostLabel'),
            viewProfile: document.getElementById('viewProfile'),
            viewProfileBlog: document.getElementById('viewProfileBlog'),
            viewBlog: document.getElementById('viewBlog'),
            languageToggle: document.getElementById('languageToggle'),
            themeToggle: document.getElementById('themeToggle')
        };

        const blogState = {
            posts: [],
            filtered: [],
            currentIndex: -1,
            loaded: false
        };

        let currentLang = 'zh';

        function getBrowserLanguage() {
            const lang = navigator.language || navigator.userLanguage;
            return lang.startsWith('zh') ? 'zh' : 'en';
        }

        function updateEmptyStateText() {
            const t = i18n[currentLang];
            const state = elements.emptyState.dataset.state || 'empty';
            if (state === 'loading') {
                elements.emptyState.textContent = t.loading;
            } else if (state === 'error') {
                elements.emptyState.textContent = t.error;
            } else {
                elements.emptyState.textContent = t.empty;
            }
        }

        function setLanguage(lang) {
            currentLang = lang;
            const t = i18n[lang];
            document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en-US';
            document.getElementById('name').textContent = t.name;
            document.getElementById('subtitle').textContent = t.subtitle;
            elements.viewProfile.textContent = t.viewProfile;
            elements.viewBlog.textContent = t.viewBlog;
            elements.blogTitle.textContent = t.blogTitle;
            elements.blogSubtitle.textContent = t.blogSubtitle;
            elements.backHomeLabel.textContent = t.backHome;
            elements.backToListLabel.textContent = t.backToList;
            elements.prevPostLabel.textContent = t.prevPost;
            elements.nextPostLabel.textContent = t.nextPost;
            elements.searchInput.placeholder = t.searchPlaceholder;
            elements.languageToggle.querySelector('span').textContent = t.langToggle;
            elements.themeToggle.title = t.themeTitle;
            elements.languageToggle.title = t.langTitle;
            elements.viewProfileBlog.textContent = t.viewProfileBlog;
            document.getElementById('interestsTitle').textContent = t.interestsTitle;
            document.getElementById('codingTitle').textContent = t.codingTitle;
            document.getElementById('codingSubtitle').textContent = t.codingSubtitle;
            document.getElementById('vocaloidTitle').textContent = t.vocaloidTitle;
            document.getElementById('vocaloidSubtitle').textContent = t.vocaloidSubtitle;
            document.getElementById('scifiTitle').textContent = t.scifiTitle;
            document.getElementById('scifiSubtitle').textContent = t.scifiSubtitle;
            updateEmptyStateText();
            updateArticleMeta();
            localStorage.setItem('language', lang);
        }

        const savedLang = localStorage.getItem('language') || getBrowserLanguage();
        setLanguage(savedLang);

        elements.languageToggle.addEventListener('click', () => {
            const newLang = currentLang === 'zh' ? 'en' : 'zh';
            setLanguage(newLang);
        });

        const themeToggle = elements.themeToggle;
        const themeIcon = themeToggle.querySelector('i');
        const savedTheme = localStorage.getItem('theme');

        if (savedTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }

        themeToggle.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                document.documentElement.removeAttribute('data-theme');
                themeIcon.classList.replace('fa-sun', 'fa-moon');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeIcon.classList.replace('fa-moon', 'fa-sun');
                localStorage.setItem('theme', 'dark');
            }
        });

        function showBlog() {
            elements.profileCard.hidden = true;
            elements.blogCard.hidden = false;
            if (!blogState.loaded) {
                loadPosts();
            }
            history.replaceState(null, '', `${window.location.pathname}#blog`);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showProfile() {
            elements.blogCard.hidden = true;
            elements.profileCard.hidden = false;
            history.replaceState(null, '', window.location.pathname);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        elements.blogButton.addEventListener('click', showBlog);
        elements.backHomeButton.addEventListener('click', showProfile);

        elements.backToList.addEventListener('click', () => {
            elements.articlePanel.hidden = true;
        });

        function extractSummary(markdown) {
            const plain = markdown
                .replace(/```[\s\S]*?```/g, '')
                .replace(/`[^`]+`/g, '')
                .replace(/^[#>\-\*\d\.\s]+/gm, '')
                .split('\n')
                .map(line => line.trim())
                .filter(Boolean);
            if (!plain.length) {
                return '';
            }
            const snippet = plain[0];
            return snippet.length > 120 ? `${snippet.slice(0, 120)}...` : snippet;
        }

        function renderPostList(list) {
            elements.postList.innerHTML = '';
            list.forEach(post => {
                const card = document.createElement('article');
                card.className = 'post-card hover-surface';
                card.innerHTML = `
                    <div class="post-title">${post.slug}</div>
                    ${post.summary ? `<div class="post-summary">${post.summary}</div>` : ''}
                `;
                card.addEventListener('click', () => openPost(post.slug));
                elements.postList.appendChild(card);
            });
            if (list.length === 0) {
                elements.emptyState.dataset.state = 'empty';
                updateEmptyStateText();
                elements.emptyState.hidden = false;
            } else {
                elements.emptyState.hidden = true;
            }
        }

        function updateArticleMeta() {
            if (blogState.currentIndex < 0) {
                return;
            }
            const post = blogState.posts[blogState.currentIndex];
            if (!post) {
                return;
            }
            elements.articleMeta.textContent = `${i18n[currentLang].fileLabel}: ${post.filename}`;
        }

        async function loadPosts() {
            try {
                elements.emptyState.dataset.state = 'loading';
                updateEmptyStateText();
                elements.emptyState.hidden = false;
                const response = await fetch('https://api.github.com/repos/ff66ccff/ff66ccff.github.io/contents/posts');
                if (!response.ok) {
                    throw new Error('Failed to fetch directory listing');
                }
                const files = await response.json();
                const markdownFiles = files.filter(file => file.type === 'file' && file.name.endsWith('.md'));
                const posts = await Promise.all(markdownFiles.map(async (file) => {
                    const res = await fetch(`${file.download_url}?cacheBust=${Date.now()}`);
                    if (!res.ok) {
                        throw new Error(`Failed to fetch ${file.name}`);
                    }
                    const content = await res.text();
                    return {
                        slug: file.name.replace(/\.md$/, ''),
                        filename: file.name,
                        content,
                        summary: extractSummary(content)
                    };
                }));
                posts.sort((a, b) => b.filename.localeCompare(a.filename));
                blogState.posts = posts;
                blogState.filtered = [...posts];
                blogState.loaded = true;
                renderPostList(blogState.filtered);
                if (!posts.length) {
                    elements.emptyState.dataset.state = 'empty';
                    updateEmptyStateText();
                    elements.emptyState.hidden = false;
                }
            } catch (error) {
                console.error(error);
                blogState.loaded = false;
                elements.emptyState.dataset.state = 'error';
                updateEmptyStateText();
                elements.emptyState.hidden = false;
            }
        }

        elements.searchInput.addEventListener('input', (event) => {
            const keyword = event.target.value.trim().toLowerCase();
            if (!blogState.loaded) {
                return;
            }
            if (!keyword) {
                blogState.filtered = [...blogState.posts];
            } else {
                blogState.filtered = blogState.posts.filter(post => {
                    const haystack = `${post.slug} ${post.content}`.toLowerCase();
                    return haystack.includes(keyword);
                });
            }
            renderPostList(blogState.filtered);
            if (blogState.filtered.length === 0) {
                elements.articlePanel.hidden = true;
            }
        });

        function openPost(slug) {
            const absoluteIndex = blogState.posts.findIndex(post => post.slug === slug);
            if (absoluteIndex === -1) {
                return;
            }
            blogState.currentIndex = absoluteIndex;
            const post = blogState.posts[absoluteIndex];
            elements.articleTitle.textContent = post.slug;
            const html = marked.parse(post.content, { gfm: true, breaks: true });
            elements.articleContent.innerHTML = html;
            Prism.highlightAllUnder(elements.articleContent);
            updateArticleMeta();
            elements.articlePanel.hidden = false;
            updateNavigationButtons();
        }

        function updateNavigationButtons() {
            const order = blogState.filtered.length ? blogState.filtered : blogState.posts;
            const currentSlug = blogState.posts[blogState.currentIndex]?.slug;
            const pointer = order.findIndex(post => post.slug === currentSlug);
            const prev = pointer > 0 ? order[pointer - 1] : null;
            const next = pointer >= 0 && pointer < order.length - 1 ? order[pointer + 1] : null;

            elements.prevPost.disabled = !prev;
            elements.nextPost.disabled = !next;

            elements.prevPost.onclick = prev ? () => openPost(prev.slug) : null;
            elements.nextPost.onclick = next ? () => openPost(next.slug) : null;
        }

        elements.backToList.addEventListener('click', () => {
            elements.articlePanel.hidden = true;
        });

        function loadAvatar() {
            const avatarImage = document.getElementById('avatarImage');
            const avatarIcon = document.querySelector('.avatar-icon');

            if (!avatarImage || !avatarIcon) {
                return;
            }

            const showImage = () => {
                avatarImage.style.display = 'block';
                avatarIcon.style.display = 'none';
            };

            const showFallback = () => {
                avatarImage.style.display = 'none';
                avatarIcon.style.display = 'flex';
            };

            avatarImage.addEventListener('load', showImage);
            avatarImage.addEventListener('error', showFallback);

            if (avatarImage.complete) {
                if (avatarImage.naturalWidth > 0) {
                    showImage();
                } else {
                    showFallback();
                }
            } else {
                showFallback();
            }
        }

        function initPointerHighlights() {
            const surfaces = document.querySelectorAll('.hover-surface');
            const bodyEl = document.body;

            const setBackgroundGlow = (x, y) => {
                bodyEl.style.setProperty('--bg-pointer-opacity', '1');
                bodyEl.style.setProperty('--bg-pointer-x', `${x}px`);
                bodyEl.style.setProperty('--bg-pointer-y', `${y}px`);
            };

            const hideBackgroundGlow = () => {
                bodyEl.style.setProperty('--bg-pointer-opacity', '0');
            };

            const updateBackgroundFromPosition = (x, y, target) => {
                const hoveringSurface = target && typeof target.closest === 'function'
                    ? target.closest('.hover-surface')
                    : null;

                if (hoveringSurface) {
                    hideBackgroundGlow();
                } else {
                    setBackgroundGlow(x, y);
                }
            };

            document.addEventListener('pointermove', (event) => {
                if (event.pointerType === 'touch') {
                    return;
                }
                updateBackgroundFromPosition(event.clientX, event.clientY, event.target);
            });

            document.addEventListener('pointerleave', (event) => {
                if (!event.relatedTarget) {
                    hideBackgroundGlow();
                }
            });

            window.addEventListener('blur', hideBackgroundGlow);

            const handleGlobalTouchMove = (event) => {
                const touch = event.touches && event.touches[0];
                if (!touch) {
                    hideBackgroundGlow();
                    return;
                }
                const targetElement = document.elementFromPoint
                    ? document.elementFromPoint(touch.clientX, touch.clientY)
                    : event.target;
                updateBackgroundFromPosition(touch.clientX, touch.clientY, targetElement);
            };

            document.addEventListener('touchmove', handleGlobalTouchMove, { passive: true });
            document.addEventListener('touchend', hideBackgroundGlow);
            document.addEventListener('touchcancel', hideBackgroundGlow);

            const activateSurface = (surface) => {
                surface.classList.add('is-active');
                hideBackgroundGlow();
            };

            const deactivateSurface = (surface) => {
                surface.classList.remove('is-active');
                surface.style.removeProperty('--pointer-x');
                surface.style.removeProperty('--pointer-y');
            };

            surfaces.forEach((surface) => {
                surface.addEventListener('pointerenter', () => {
                    activateSurface(surface);
                });

                surface.addEventListener('pointermove', (event) => {
                    const rect = surface.getBoundingClientRect();
                    const x = event.clientX - rect.left;
                    const y = event.clientY - rect.top;
                    surface.style.setProperty('--pointer-x', `${x}px`);
                    surface.style.setProperty('--pointer-y', `${y}px`);
                    surface.classList.add('is-active');
                });

                surface.addEventListener('pointerleave', () => {
                    deactivateSurface(surface);
                });

                surface.addEventListener('touchstart', (event) => {
                    const touch = event.touches && event.touches[0];
                    if (!touch) {
                        return;
                    }
                    activateSurface(surface);
                    const rect = surface.getBoundingClientRect();
                    surface.style.setProperty('--pointer-x', `${touch.clientX - rect.left}px`);
                    surface.style.setProperty('--pointer-y', `${touch.clientY - rect.top}px`);
                }, { passive: true });

                surface.addEventListener('touchmove', (event) => {
                    const touch = event.touches && event.touches[0];
                    if (!touch) {
                        return;
                    }
                    const rect = surface.getBoundingClientRect();
                    surface.style.setProperty('--pointer-x', `${touch.clientX - rect.left}px`);
                    surface.style.setProperty('--pointer-y', `${touch.clientY - rect.top}px`);
                }, { passive: true });

                const endTouch = () => {
                    deactivateSurface(surface);
                    hideBackgroundGlow();
                };

                surface.addEventListener('touchend', endTouch);
                surface.addEventListener('touchcancel', endTouch);
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadAvatar();
            initPointerHighlights();
            if (window.location.hash === '#blog') {
                showBlog();
            }
        });
    </script>
</body>

</html>
