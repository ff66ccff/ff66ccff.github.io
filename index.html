<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ff66ccff - Personal Blog</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary-color: #667eea;
            --secondary-color: #764ba2;
            --accent-blue: #4facfe;
            --accent-pink: #f093fb;
            --accent-cyan: #00d4ff;
            --bg-primary: #f5f7fa;
            --bg-card: #ffffff;
            --text-primary: #1f2937;
            --text-secondary: #4b5563;
            --text-muted: #6b7280;
            --border-color: rgba(15, 23, 42, 0.08);
            --shadow-sm: 0 4px 12px rgba(15, 23, 42, 0.08);
            --shadow-md: 0 12px 36px rgba(15, 23, 42, 0.12);
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-card: #111c34;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5f5;
            --text-muted: #94a3b8;
            --border-color: rgba(148, 163, 184, 0.28);
            --shadow-sm: 0 4px 12px rgba(8, 15, 35, 0.65);
            --shadow-md: 0 12px 36px rgba(8, 15, 35, 0.75);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Poppins', 'Helvetica Neue', Arial, sans-serif;
            background: radial-gradient(circle at top, rgba(102, 126, 234, 0.28), transparent 55%),
                radial-gradient(circle at bottom, rgba(118, 75, 162, 0.25), transparent 65%),
                var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 16px;
            transition: background 0.4s ease, color 0.4s ease;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .page {
            width: 100%;
            max-width: 960px;
        }

        .hover-surface {
            position: relative;
            z-index: 0;
        }

        .hover-surface::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(420px circle at var(--pointer-x, 50%) var(--pointer-y, 50%), rgba(255, 255, 255, 0.22), transparent 70%);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: -1;
        }

        .hover-surface.is-active::before {
            opacity: 1;
        }

        .profile-card {
            position: relative;
            background: var(--bg-card);
            border-radius: 32px;
            padding: 48px;
            box-shadow: var(--shadow-md);
            border: 1px solid rgba(255, 255, 255, 0.06);
            overflow: hidden;
        }

        .profile-card::before {
            background: radial-gradient(120% 120% at var(--pointer-x, 50%) var(--pointer-y, 50%), rgba(102, 126, 234, 0.18), rgba(118, 75, 162, 0.05) 56%, transparent 75%);
        }

        .profile-content {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: minmax(180px, 1fr) 1.4fr;
            gap: 48px;
            align-items: center;
        }

        .intro-section {
            text-align: center;
        }

        .avatar-wrapper {
            width: 160px;
            height: 160px;
            margin: 0 auto 24px;
            border-radius: 32px;
            padding: 6px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        }

        .avatar {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 26px;
            background: rgba(255, 255, 255, 0.92);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: var(--primary-color);
            font-size: 54px;
        }

        [data-theme="dark"] .avatar {
            background: rgba(13, 23, 46, 0.85);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .name {
            font-size: 2.4rem;
            font-weight: 700;
            margin: 0 0 12px;
        }

        .subtitle {
            margin: 0;
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .details-section {
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        .section-title {
            margin: 0 0 18px;
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .interests-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 18px;
        }

        .interest-card {
            padding: 20px;
            border-radius: 20px;
            background: rgba(102, 126, 234, 0.08);
            border: 1px solid rgba(102, 126, 234, 0.18);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .interest-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-sm);
        }

        [data-theme="dark"] .interest-card {
            background: rgba(102, 126, 234, 0.12);
            border-color: rgba(102, 126, 234, 0.28);
        }

        .interest-icon {
            font-size: 1.6rem;
            color: var(--primary-color);
            margin-bottom: 12px;
        }

        .interest-title {
            font-weight: 600;
            margin-bottom: 6px;
        }

        .interest-subtitle {
            color: var(--text-muted);
            margin: 0;
            font-size: 0.9rem;
        }

        .actions-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-top: auto;
        }

        .action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 28px;
            border-radius: 18px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: #ffffff;
            box-shadow: var(--shadow-sm);
        }

        .action-btn.secondary {
            background: rgba(102, 126, 234, 0.12);
            color: var(--primary-color);
        }

        .action-btn:hover {
            transform: translateY(-3px);
        }

        .control-btn {
            position: fixed;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-primary);
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            z-index: 1000;
        }

        .control-btn:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }

        .theme-toggle {
            top: 28px;
            right: 28px;
        }

        .language-toggle {
            top: 28px;
            left: 28px;
            font-weight: 600;
        }

        .tagline {
            margin: 0;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .language-toggle span {
            font-size: 0.95rem;
        }

        @media (max-width: 1024px) {
            body {
                padding: 40px 16px;
            }

            .profile-card {
                padding: 40px;
            }

            .profile-content {
                grid-template-columns: 1fr;
                gap: 36px;
            }

            .actions-row {
                justify-content: center;
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 28px 12px;
            }

            .profile-card {
                padding: 32px 24px;
            }

            .avatar-wrapper {
                width: 132px;
                height: 132px;
            }

            .name {
                font-size: 2rem;
            }

            .control-btn {
                width: 44px;
                height: 44px;
            }

            .theme-toggle {
                top: 20px;
                right: 20px;
            }

            .language-toggle {
                top: 20px;
                left: 20px;
            }

            .actions-row {
                gap: 12px;
            }

            .action-btn {
                flex: 1 1 100%;
            }
        }
    </style>
</head>

<body>
    <div class="page">
        <section class="profile-card hover-surface" id="profileCard">
            <div class="profile-content">
                <div class="intro-section">
                    <div class="avatar-wrapper hover-surface" id="avatarWrapper">
                        <div class="avatar" id="avatarContainer">
                            <div class="avatar-icon">
                                <i class="fas fa-user"></i>
                            </div>
                            <img id="avatarImage" src="avatar.jpg" alt="Profile Picture">
                        </div>
                    </div>
                    <h1 class="name" id="name">ff66ccff</h1>
                    <p class="subtitle" id="subtitle">四川大学 25级计算机学生</p>
                </div>
                <div class="details-section">
                    <div>
                        <h2 class="section-title" id="interestsTitle">我的兴趣</h2>
                        <div class="interests-grid">
                            <article class="interest-card hover-surface">
                                <div class="interest-icon"><i class="fas fa-code"></i></div>
                                <div class="interest-title" id="codingTitle">编程</div>
                                <p class="interest-subtitle" id="codingSubtitle">Programming</p>
                            </article>
                            <article class="interest-card hover-surface">
                                <div class="interest-icon"><i class="fas fa-music"></i></div>
                                <div class="interest-title" id="vocaloidTitle">中文 VOCALOID</div>
                                <p class="interest-subtitle" id="vocaloidSubtitle">Chinese Vocaloid</p>
                            </article>
                            <article class="interest-card hover-surface">
                                <div class="interest-icon"><i class="fas fa-rocket"></i></div>
                                <div class="interest-title" id="scifiTitle">科幻小说</div>
                                <p class="interest-subtitle" id="scifiSubtitle">Sci-Fi Novels</p>
                            </article>
                        </div>
                    </div>
                    <p class="tagline" id="tagline">记录代码、音乐与故事，分享我的学习旅程。</p>
                    <div class="actions-row">
                        <a class="action-btn hover-surface" href="https://github.com/ff66ccff" target="_blank"
                            rel="noopener" id="githubButton">
                            <i class="fab fa-github"></i>
                            <span id="viewProfile">查看我的 GitHub</span>
                        </a>
                        <a class="action-btn secondary hover-surface" href="blog.html" id="blogLink">
                            <i class="fas fa-book-open"></i>
                            <span id="viewBlog">进入博客</span>
                        </a>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <button class="control-btn theme-toggle" id="themeToggle" type="button" title="切换主题">
        <i class="fas fa-moon"></i>
    </button>

    <button class="control-btn language-toggle" id="languageToggle" type="button" title="切换语言">
        <span>中</span>
    </button>

    <script>
        const i18n = {
            zh: {
                name: "ff66ccff",
                subtitle: "四川大学 25级计算机学生",
                interestsTitle: "我的兴趣",
                codingTitle: "编程",
                codingSubtitle: "Programming",
                vocaloidTitle: "中文 VOCALOID",
                vocaloidSubtitle: "Chinese Vocaloid",
                scifiTitle: "科幻小说",
                scifiSubtitle: "Sci-Fi Novels",
                tagline: "记录代码、音乐与故事，分享我的学习旅程。",
                viewProfile: "查看我的 GitHub",
                viewBlog: "进入博客",
                langToggle: "中",
                themeTitle: "切换主题",
                langTitle: "切换语言"
            },
            en: {
                name: "ff66ccff",
                subtitle: "Computer Science Student, Class of 2025, Sichuan University",
                interestsTitle: "My Interests",
                codingTitle: "Programming",
                codingSubtitle: "Code & Dev",
                vocaloidTitle: "Chinese VOCALOID",
                vocaloidSubtitle: "Music & Voice Synth",
                scifiTitle: "Sci-Fi Novels",
                scifiSubtitle: "Science Fiction",
                tagline: "Notes on coding, music, and stories from my learning journey.",
                viewProfile: "View My GitHub",
                viewBlog: "Visit Blog",
                langToggle: "EN",
                themeTitle: "Toggle Theme",
                langTitle: "Switch Language"
            }
        };

        const elements = {
            name: document.getElementById('name'),
            subtitle: document.getElementById('subtitle'),
            interestsTitle: document.getElementById('interestsTitle'),
            codingTitle: document.getElementById('codingTitle'),
            codingSubtitle: document.getElementById('codingSubtitle'),
            vocaloidTitle: document.getElementById('vocaloidTitle'),
            vocaloidSubtitle: document.getElementById('vocaloidSubtitle'),
            scifiTitle: document.getElementById('scifiTitle'),
            scifiSubtitle: document.getElementById('scifiSubtitle'),
            tagline: document.getElementById('tagline'),
            viewProfile: document.getElementById('viewProfile'),
            viewBlog: document.getElementById('viewBlog'),
            languageToggle: document.getElementById('languageToggle'),
            themeToggle: document.getElementById('themeToggle'),
            avatarImage: document.getElementById('avatarImage'),
            avatarIcon: document.querySelector('.avatar-icon'),
            hoverSurfaces: document.querySelectorAll('.hover-surface')
        };

        let currentLang = 'zh';

        function getBrowserLanguage() {
            const lang = navigator.language || navigator.userLanguage || '';
            return lang.toLowerCase().startsWith('zh') ? 'zh' : 'en';
        }

        function setLanguage(lang) {
            currentLang = lang;
            const t = i18n[lang];
            document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en-US';
            elements.name.textContent = t.name;
            elements.subtitle.textContent = t.subtitle;
            elements.interestsTitle.textContent = t.interestsTitle;
            elements.codingTitle.textContent = t.codingTitle;
            elements.codingSubtitle.textContent = t.codingSubtitle;
            elements.vocaloidTitle.textContent = t.vocaloidTitle;
            elements.vocaloidSubtitle.textContent = t.vocaloidSubtitle;
            elements.scifiTitle.textContent = t.scifiTitle;
            elements.scifiSubtitle.textContent = t.scifiSubtitle;
            elements.tagline.textContent = t.tagline;
            elements.viewProfile.textContent = t.viewProfile;
            elements.viewBlog.textContent = t.viewBlog;
            elements.languageToggle.querySelector('span').textContent = t.langToggle;
            elements.themeToggle.title = t.themeTitle;
            elements.languageToggle.title = t.langTitle;
            localStorage.setItem('language', lang);
        }

        function initLanguage() {
            const savedLang = localStorage.getItem('language');
            const langToUse = savedLang === 'zh' || savedLang === 'en' ? savedLang : getBrowserLanguage();
            setLanguage(langToUse);
        }

        function initLanguageToggle() {
            elements.languageToggle.addEventListener('click', () => {
                const next = currentLang === 'zh' ? 'en' : 'zh';
                setLanguage(next);
            });
        }

        function initTheme() {
            const themeIcon = elements.themeToggle.querySelector('i');
            const saved = localStorage.getItem('theme');
            if (saved === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeIcon.classList.replace('fa-moon', 'fa-sun');
            }
            elements.themeToggle.addEventListener('click', () => {
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                if (isDark) {
                    document.documentElement.removeAttribute('data-theme');
                    themeIcon.classList.replace('fa-sun', 'fa-moon');
                    localStorage.setItem('theme', 'light');
                } else {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    themeIcon.classList.replace('fa-moon', 'fa-sun');
                    localStorage.setItem('theme', 'dark');
                }
            });
        }

        function loadAvatar() {
            if (!elements.avatarImage || !elements.avatarIcon) {
                return;
            }

            const showImage = () => {
                elements.avatarImage.style.display = 'block';
                elements.avatarIcon.style.display = 'none';
            };

            const showFallback = () => {
                elements.avatarImage.style.display = 'none';
                elements.avatarIcon.style.display = 'flex';
            };

            elements.avatarImage.addEventListener('load', showImage);
            elements.avatarImage.addEventListener('error', showFallback);

            if (elements.avatarImage.complete && elements.avatarImage.naturalWidth > 0) {
                showImage();
            } else {
                showFallback();
            }
        }

        function initPointerHighlights() {
            elements.hoverSurfaces.forEach((surface) => {
                surface.addEventListener('pointerenter', () => {
                    surface.classList.add('is-active');
                });

                surface.addEventListener('pointermove', (event) => {
                    const rect = surface.getBoundingClientRect();
                    const x = event.clientX - rect.left;
                    const y = event.clientY - rect.top;
                    surface.style.setProperty('--pointer-x', `${x}px`);
                    surface.style.setProperty('--pointer-y', `${y}px`);
                });

                const clearSurface = () => {
                    surface.classList.remove('is-active');
                    surface.style.removeProperty('--pointer-x');
                    surface.style.removeProperty('--pointer-y');
                };

                surface.addEventListener('pointerleave', clearSurface);
                surface.addEventListener('touchstart', (event) => {
                    const touch = event.touches && event.touches[0];
                    if (!touch) {
                        return;
                    }
                    const rect = surface.getBoundingClientRect();
                    surface.style.setProperty('--pointer-x', `${touch.clientX - rect.left}px`);
                    surface.style.setProperty('--pointer-y', `${touch.clientY - rect.top}px`);
                    surface.classList.add('is-active');
                }, { passive: true });
                surface.addEventListener('touchend', clearSurface);
                surface.addEventListener('touchcancel', clearSurface);
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            initLanguage();
            initLanguageToggle();
            initTheme();
            loadAvatar();
            initPointerHighlights();
        });
    </script>
</body>

</html>
